<!-- ============================================================
     טלפון ← גרסת האפליקציה
     ============================================================
     ⚠ **הרעיון של שקד · 23 בספטמבר 2026** · ״האתר צריך לשבת על
     הכתובת הזו, ובמידה ולקוח פתח את האתר בטלפון מה שיופיע יהיה
     התצוגה שנראית בדיוק כמו האפליקצייה״.

     ⚠ **למה כאן, לפני כל `link`** · `location.replace` עוצר את
     מנתח ה-HTML במקום, וכך שום *תמונה* של עמוד הנחיתה לא נטענת.

     ⚠ **אבל זה לא חוסך הכול · נמדד ב-23.9.2026** · סורק הטעינה
     המקדימה של הדפדפן רץ לפני המנתח, ולכן הוא כבר הזמין את
     `style.css`, `data.js`, `build.js` והגופנים מגוגל לפני
     שההפניה נכנסה לתוקף. נמדד בכרום עם UA של אייפון:
     35.7KB דחוסים מבוזבזים, 4.7% מהבאנדל שהטלפון עומד להוריד
     בכל מקרה. טענתי כאן קודם שזה אפס; זה לא.

     ⚠ **למה `loading="lazy"` על הלוגו** · הסורק המקדים מדלג על
     תמונות מושהות, ולכן הלוגו (89KB) לא נטען בטלפון בכלל.
     בלעדיו הבזבוז היה 125KB — פי 3.5. על שולחן העבודה נמדד
     שהלוגו בניווט מוכן תוך 1.2 שנ׳ ושלוש ההופעות מוצגות, כי
     הוא סמל של 36px ולא התמונה הגדולה של העמוד.

     ⚠ **איך מבטלים את הבזבוז לגמרי** · רק החלטה שקורית לפני
     שה-HTML נשלח. Cloudflare כבר יושב לפני הדומיין (נמדד:
     `server: cloudflare`), ו-Origin Rule שמחליף את הנתיב
     ל-`/app/` לפי `http.user_agent` היה שולח לטלפון את
     האפליקציה מיד — ובלי לשנות את הכתובת בשורה. זו הגדרה
     בלוח הבקרה של Cloudflare, לא קוד, ולכן היא לא כאן.

     ⚠ **`replace` ולא `href`** · `href` היה מוסיף רשומה
     להיסטוריה, ואז ״חזור״ מהאפליקציה חוזר לכאן, וכאן מפנה שוב
     לאפליקציה — לולאה שמשביתה את כפתור החזרה. `replace` מחליף
     את הרשומה, ו״חזור״ יוצא החוצה כרגיל.

     ⚠ **`Mobi` ולא רוחב המסך** · כל דפדפני הטלפון שמים את
     האסימון הזה, ו-iPadOS משמיט אותו בכוונה. בדיקת רוחב הייתה
     זורקת לאפליקציה גם מי שסתם הצר חלון במחשב.

     ⚠ **הסורקים לא מופנים** · גוגל מדרגת היום לפי הגרסה
     הניידת. שהיא תראה את עמוד הנחיתה המלא ולא קליפה של
     אפליקציה שכל תוכנה מגיע מ-JavaScript.

     ⚠ **דלת מילוט** · `?site=1` מציג את עמוד הנחיתה גם בטלפון.
  -->
<script>
(function () {
  var APP = '/app/';
  /* ⚠ ריק בכוונה · ביום שהטופס ״עדכנו אותי״ יהיה מוכן, כאן
     נכנס '?showroom=1' וזה הופך את הטלפון לחלון ראווה בלבד.
     היום הטלפון מקבל את האפליקציה המלאה, כי כפתור שמוביל
     לטופס שלא קיים גרוע ממצב שבו אפשר להזמין. */
  var FLAGS = '';

  var ua = navigator.userAgent || '';
  if (/bot|crawl|spider|slurp|facebookexternalhit|whatsapp|embed|preview/i.test(ua)) return;
  if (/[?&]site=1(&|$)/.test(location.search)) return;
  if (!/Mobi/i.test(ua)) return;

  location.replace(APP + FLAGS);
})();
</script>

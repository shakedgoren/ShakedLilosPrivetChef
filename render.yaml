# BITE & TELL · פריסה ל-Render
#
# ⚠ **שורש המאגר, לא `server/`.** השרת מייבא 20 קבצים מתוך
# `mobile/src` — קטלוג המנות, חישוב המחיר, חלונות המכירה ולוח
# השנה. אלה מקור אמת אחד לשני הצדדים, ולכן אסור שהפריסה תכלול
# רק את `server/`. מכאן ה-`cd server` בכל פקודה.
#
# ⚠ **`migrate deploy` ב-`startCommand`, לא ב-build ולא ב-preDeploy** ·
# סביבת ה-build ב-Render לא מגיעה ל-Postgres הפרטי (ה-hostname
# הפנימי מ-`fromDatabase`, שגיאת P1001). אסור להריץ מיגרציה
# בזמן build. `preDeployCommand` נכשל כאן באותה שגיאה — לכן
# המיגרציה רצה בתחילת `startCommand`, לפני `npm start`: ה-start
# תמיד רץ בסביבה שמגיעה למסד. `deploy` (ולא `migrate dev`) מריץ
# רק מיגרציות שכבר נכתבו ונבדקו, ולעולם אינו מייצר חדשה ואינו
# מאפס. זו הפקודה היחידה שמותר להריץ על מסד חי.
#
# ⚠ **המסד והשירות באותו אזור (`oregon`)** · רשת פרטית
# ב-Render לא חוצה אזורים. המסד הקיים כבר ב-Oregon וה-API
# היה ב-Frankfurt — זו שגיאת P1001. שינוי אזור ב-Blueprint
# לא מזיז מסד שכבר הוקם, ולכן שניהם oregon עד שמוחקים
# ויוצרים את המסד מחדש ב-Frankfurt (ואז מעבירים גם את ה-API).
#
# ⚠ **אין `db:seed` בפריסה** · הזריעה תיצור חשבון ניהול עם
# הסיסמה שב-`ADMIN_PASSWORD`. להריץ פעם אחת ידנית מה-Shell של
# Render, ולא בכל פריסה.
#
# להעלאה: Render → New → Blueprint → לחבר את המאגר.

databases:
  - name: bite-and-tell-db
    databaseName: biteandtell
    user: bite
    # ⚠ אותו אזור כמו bite-and-tell-api · המסד הקיים ב-Oregon, Blueprint לא מזיז אותו
    region: oregon
    # ⚠ התוכנית החינמית נמחקת אחרי 30 יום · לעסק אמיתי צריך בתשלום
    plan: basic-256mb

services:
  - type: web
    name: bite-and-tell-api
    runtime: node
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /health
    # generate בלבד · המיגרציה ב-startCommand (ה-build לא רואה את המסד הפרטי)
    buildCommand: cd server && npm ci && npx prisma generate
    startCommand: cd server && npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production

      # engines ב-server/package.json דורשים >=22
      - key: NODE_VERSION
        value: "22"

      # ⚠ מגיע מהמסד שלמעלה · Render ממלא אותו לבד
      - key: DATABASE_URL
        fromDatabase:
          name: bite-and-tell-db
          property: connectionString

      # ⚠ נוצר אוטומטית · אסור שיהיה זהה לזה של הפיתוח.
      # החלפה שלו מנתקת את כל המשתמשות המחוברות.
      - key: JWT_SECRET
        generateValue: true

      # ⚠ **חובה** · בלעדיו הגבלת הקצב רואה את כל העולם ככתובת
      # אחת וחוסמת את כולם יחד · ראו `http/rateLimit`
      - key: TRUST_PROXY
        value: "1"

      - key: PORT
        value: "3001"
      - key: HOST
        value: 0.0.0.0
      - key: JWT_EXPIRES_HOURS
        value: "168"

      # ⚠ **חובה** · מקורות שמותר להם לפנות מדפדפן. ריק בפרודקשן
      # = שום דפדפן. האפליקציה הנייטיבית לא מושפעת.
      - key: CORS_ORIGINS
        sync: false

      # חשבון הניהול · נקרא רק כשמריצים זריעה
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false

      # כניסה עם גוגל · בלעדיו /auth/google מחזיר 501
      - key: GOOGLE_CLIENT_ID
        sync: false

      # מייל · איפוס סיסמה. בלעדיו המסלול הזה מת בשקט
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # ⚠ **APP_URL לא נחוץ · 23 בספטמבר 2026** · הוא שימש לבניית
      # קישור איפוס סיסמה, והקישור הזה הוסר לחלוטין ב-19 בספטמבר
      # לטובת קוד בן שש ספרות (ראו `mail/resetEmail.ts`). שום קוד
      # לא קורא אותו יותר, ולכן אין מה למלא בו.

      # וואטסאפ · בלי TOKEN השרת רץ והשליחות מדולגות
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WABA_ID
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false

      # ⚠ **לא להגדיר RESET_DEBUG** · הוא מחזיר את אסימון איפוס
      # הסיסמה בגוף התשובה. הקוד כבר כובה אותו בפרודקשן, וזו
      # שכבה שנייה.

  # ==========================================================================
  # האתר · גרסת הדפדפן של האפליקציה · **אותו קוד שהולך לחנויות**
  # --------------------------------------------------------------------------
  # ⚠ **למה כאן ולא אצל ספק אחר · 23 בספטמבר 2026** · שקד ביקשה
  # שהכתובת תישא רק את שם העסק. ספקים אחרים מזריקים תג משלהם
  # לתוך ה-HTML (״Powered by…״) גם כשהדומיין פרטי. Render מגיש
  # בדיוק את מה שנבנה, ולכן הכול יושב כאן: השרת, המסד והאתר.
  #
  # ⚠ **הבנייה מריצה `expo export` ולכן צריכה את כל התלויות** ·
  # `npm ci` ולא `--omit=dev`. Metro הוא תלות פיתוח.
  #
  # ⚠ **`EXPO_PUBLIC_API_URL` נצרב לתוך הבאנדל בזמן הבנייה** ·
  # הוא לא נקרא בזמן ריצה. שינוי שלו מחייב בנייה מחדש. הוא כתובת
  # ציבורית ולא סוד, ולכן הערך שלו כאן ולא ב-sync:false.
  #
  # ⚠ **`--clear` חובה** · Metro החזיר באנדל ממטמון אחרי שינוי
  # ב-`.env`, וכתובת שרת מקומית נצרבה לבנייה שיועדה לפרודקשן.
  # זה קרה כאן בפועל ב-23 בספטמבר.
  - type: web
    name: bite-and-tell-web
    runtime: static
    branch: main
    # ⚠ **שני משטחים מבנייה אחת · 23 בספטמבר 2026** · עמוד
    # הנחיתה בשורש, גרסת הדפדפן של האפליקציה תחת /app. הסקריפט
    # מרכיב את שניהם ל-dist/ ומפיל את הבנייה אם אחד מהם חסר.
    buildCommand: bash scripts/build-site.sh
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_API_URL
        value: https://api.bite-and-tell.com

    # ⚠ **`EXPO_PUBLIC_SHOWROOM` לא מוגדר בכוונה** · הדגל הופך את
    # כל כפתורי ההמשך ל״להזמנה״ ומוריד את כרטיסי ה-+/- — כלומר
    # **מבטל את האפשרות להזמין מהדפדפן**. האפליקציות עוד לא
    # בחנויות והטופס ״עדכנו אותי״ עוד לא נבנה, ולכן הדלקה עכשיו
    # הייתה משאירה את הלקוחות בלי שום דרך להזמין. ביום שהטופס
    # יהיה מוכן: להוסיף כאן `value: "1"`, או להפעיל רק לטלפון
    # דרך `FLAGS` ב-landing/index.html.

    # ⚠ **הכתובת ללא לוכסן** · `/app/index.html` הוא קובץ אמיתי,
    # ולכן `/app/` נפתר לבדו. `/app` בלי לוכסן לא, ומכאן הכלל.
    #
    # ⚠ **אין כלל `/*`** · לאפליקציה אין ניתוב כתובות בכלל —
    # `NavigationContainer` כאן בלי `linking`, ולכן היא תמיד
    # נטענת מ-`/app/` ולעולם לא מייצרת נתיב עמוק שצריך תפיסה.
    # כלל `/*` היה מסוכן: סדר הכללים לא מתועד אצל Render, והוא
    # היה עלול לבלוע את `/app`.
    routes:
      - type: rewrite
        source: /app
        destination: /app/index.html

    headers:
      # ---- אבטחה · על הכול ----
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # ⚠ **בלי X-Robots-Tag** · `static/_headers` של שאלון השף
      # נושא `noindex, nofollow`. על עמוד שיווקי זו שורה שמסתירה
      # את העסק מגוגל. עמוד הנחיתה מביא robots.txt משלו.

      # ---- הבאנדל של האפליקציה · שם הקובץ נושא hash ----
      - path: /app/_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /app/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # ---- HTML · לעולם לא במטמון ----
      # ⚠ **חייבים גם `/` וגם `/index.html`** · ההתאמה היא מול
      # הנתיב שהתבקש כמו-שהוא. נמדד ב-23.9.2026 על האתר החי:
      # הכלל `/index.html` לבדו לא חל על בקשה ל-`/`, וזו הבקשה
      # שכל מבקרת עושה.
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /app
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /app/
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /app/index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate

      # ---- קבצי עמוד הנחיתה · בלי hash בשם ----
      # ⚠ מטמון ארוך כאן היה מראה לשקד עיצוב ישן אחרי כל שינוי
      - path: /style.css
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /data.js
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /build.js
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      # התמונות כבדות ומשתנות לעתים רחוקות · שבוע
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7B5CBC; } a:hover { color: #6B4FA8; }
    .press { transition: transform 140ms ease; }
    .press:active { transform: scale(0.96); }
  </style>
</helmet>

<div dir="rtl" style="position: relative; width: 1180px; height: 820px; box-sizing: border-box; background: #FCFBFB; color: #2A2430; font-family: 'Assistant', system-ui, sans-serif; overflow: hidden;">

  <div style="position: absolute; inset: 0; background-image: radial-gradient(40% 40% at 8% 4%, rgba(186,166,228,0.07) 0%, rgba(186,166,228,0) 62%), radial-gradient(36% 36% at 95% 10%, rgba(246,180,172,0.05) 0%, rgba(246,180,172,0) 66%);"></div>

  <div style="position: relative; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 22px 26px;">

    <!-- ═══ כותרת ═══ -->
    <div style="flex-shrink: 0; display: flex; align-items: center; gap: 16px;">
      <div onClick="{{ goBack }}" class="press" style="flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; background: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 5px 12px -8px rgba(96,80,132,0.6); display: flex; align-items: center; justify-content: center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6E6478" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </div>

      <div style="flex-shrink: 0;">
        <div style="font-weight: 600; font-size: 24px; letter-spacing: -0.015em;">{{ title }}</div>
        <div style="font-weight: 300; font-size: 13.5px; color: #8A8194; margin-top: 1px;">{{ sub }}</div>
      </div>

      <!-- איסוף / משלוחים -->
      <div style="flex-shrink: 0; margin-right: 14px; box-sizing: border-box; height: 46px; border-radius: 999px; padding: 4px; background: rgba(130,112,162,0.08); display: flex; gap: 4px;">
        <sc-for list="{{ modes }}" as="m" hint-placeholder-count="2">
          <div onClick="{{ m.pick }}" class="press" style="box-sizing: border-box; height: 38px; padding: 0 22px; border-radius: 999px; cursor: pointer; background: {{ m.bg }}; box-shadow: {{ m.shadow }}; display: flex; align-items: center; gap: 8px;">
            <div style="font-size: 14.5px; font-weight: {{ m.w }}; color: {{ m.fg }}; white-space: nowrap;">{{ m.name }}</div>
            <div style="border-radius: 999px; padding: 1px 8px; background: {{ m.pillBg }};">
              <div style="font-size: 12px; font-weight: 600; color: {{ m.pillFg }}; font-variant-numeric: tabular-nums;">{{ m.count }}</div>
            </div>
          </div>
        </sc-for>
      </div>

      <div style="flex-grow: 1;"></div>

      <!-- מונים חיים -->
      <div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px;">
        <sc-for list="{{ stock }}" as="s" hint-placeholder-count="3">
          <div style="box-sizing: border-box; min-width: 108px; border-radius: 16px; padding: 8px 14px; background: {{ s.bg }}; border: 1.5px solid {{ s.bd }};">
            <div style="font-size: 11.5px; font-weight: 500; color: #7D7488;">{{ s.k }}</div>
            <div style="display: flex; align-items: baseline; gap: 4px; margin-top: 1px;">
              <div style="font-size: 19px; font-weight: 600; color: {{ s.fg }}; font-variant-numeric: tabular-nums;">{{ s.left }}</div>
              <div style="font-size: 12px; font-weight: 400; color: #A79FB2; font-variant-numeric: tabular-nums;">{{ s.of }}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- ═══ הטבלה ═══ -->
    <div style="flex-grow: 1; min-height: 0; box-sizing: border-box; border-radius: 22px; overflow: hidden; background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.85); box-shadow: 0 18px 40px -30px rgba(96,80,132,0.5); display: flex; flex-direction: column;">

      <!-- כותרות העמודות -->
      <div style="flex-shrink: 0; display: flex; align-items: stretch; background: rgba(255,255,255,0.9); border-bottom: 1.5px solid rgba(130,112,162,0.16);">
        <sc-for list="{{ cols }}" as="c" hint-placeholder-count="10">
          <div style="box-sizing: border-box; width: {{ c.w }}; flex-shrink: 0; padding: 11px 8px; text-align: {{ c.align }}; border-left: 1px solid rgba(130,112,162,0.09);">
            <div style="font-size: 12.5px; font-weight: 600; color: #4A4254; line-height: 1.25;">{{ c.t }}</div>
            <sc-if value="{{ c.hasSub }}" hint-placeholder-val="{{ true }}"><div style="font-size: 10.5px; font-weight: 400; color: #A79FB2; margin-top: 1px;">{{ c.sub }}</div></sc-if>
          </div>
        </sc-for>
      </div>

      <!-- השורות -->
      <div style="flex-grow: 1; min-height: 0; overflow-y: auto; scrollbar-width: none;">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="9">
          <div style="display: flex; align-items: stretch; background: {{ r.rowBg }}; border-bottom: 1px solid rgba(130,112,162,0.09); border-right: 4px solid {{ r.edge }};">

            <div style="box-sizing: border-box; width: 96px; flex-shrink: 0; padding: 10px 8px; border-left: 1px solid rgba(130,112,162,0.07); display: flex; align-items: center; justify-content: center;">
              <div style="font-size: 15px; font-weight: 600; color: {{ r.ink }}; font-variant-numeric: tabular-nums;">{{ r.time }}</div>
            </div>

            <div style="box-sizing: border-box; width: 186px; flex-shrink: 0; padding: 10px 12px; border-left: 1px solid rgba(130,112,162,0.07); display: flex; flex-direction: column; justify-content: center; gap: 1px;">
              <div style="font-size: 14.5px; font-weight: 600; color: {{ r.ink }}; line-height: 1.2;">{{ r.who }}</div>
              <div style="font-size: 11px; font-weight: 400; color: {{ r.muted }};">{{ r.note }}</div>
            </div>

            <sc-for list="{{ r.cells }}" as="q" hint-placeholder-count="6">
              <div onClick="{{ q.bump }}" class="press" style="box-sizing: border-box; width: 92px; flex-shrink: 0; padding: 6px; cursor: pointer; border-left: 1px solid rgba(130,112,162,0.07); display: flex; align-items: center; justify-content: center; gap: 5px;">
                <div onClick="{{ q.down }}" class="press" style="width: 22px; height: 22px; border-radius: 7px; cursor: pointer; opacity: {{ q.downOp }}; background: rgba(130,112,162,0.1); display: flex; align-items: center; justify-content: center;">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#6E6478" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"></path></svg>
                </div>
                <div style="min-width: 20px; text-align: center; font-size: 16px; font-weight: {{ q.w }}; color: {{ q.fg }}; font-variant-numeric: tabular-nums;">{{ q.n }}</div>
                <div style="width: 22px; height: 22px; border-radius: 7px; background: {{ q.upBg }}; display: flex; align-items: center; justify-content: center;">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="{{ q.upInk }}" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
                </div>
              </div>
            </sc-for>

            <div style="box-sizing: border-box; width: 104px; flex-shrink: 0; padding: 10px 8px; border-left: 1px solid rgba(130,112,162,0.07); display: flex; align-items: center; justify-content: center;">
              <div style="font-size: 15.5px; font-weight: 700; color: {{ r.ink }}; font-variant-numeric: tabular-nums; white-space: nowrap;">{{ r.sum }} ₪</div>
            </div>

            <div style="box-sizing: border-box; width: 104px; flex-shrink: 0; padding: 10px 8px; border-left: 1px solid rgba(130,112,162,0.07); display: flex; align-items: center; justify-content: center;">
              <div style="font-size: 13px; font-weight: 500; color: {{ r.muted }};">{{ r.pay }}</div>
            </div>

            <div style="box-sizing: border-box; flex-grow: 1; min-width: 0; padding: 8px 10px; display: flex; align-items: center; justify-content: flex-end; gap: 7px;">
              <div onClick="{{ r.advance }}" class="press" style="height: 34px; padding: 0 15px; border-radius: 999px; cursor: {{ r.nextCur }}; background: {{ r.nextBg }}; border: 1.5px solid {{ r.nextBd }}; display: flex; align-items: center; justify-content: center;">
                <div style="font-size: 12.5px; font-weight: 600; color: {{ r.nextFg }}; white-space: nowrap;">{{ r.nextLabel }}</div>
              </div>
              <div onClick="{{ r.drop }}" class="press" style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; background: rgba(185,83,73,0.08); display: flex; align-items: center; justify-content: center;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B95349" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
              </div>
            </div>
          </div>
        </sc-for>

        <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ true }}"><div style="padding: 70px 0; text-align: center; font-size: 15px; font-weight: 400; color: #A79FB2;">{{ emptyLabel }}</div></sc-if>
      </div>

      <!-- שורת הסיכום -->
      <div style="flex-shrink: 0; display: flex; align-items: stretch; background: rgba(255,255,255,0.92); border-top: 1.5px solid rgba(130,112,162,0.16);">
        <div style="box-sizing: border-box; width: 282px; flex-shrink: 0; padding: 12px 14px; display: flex; align-items: center;">
          <div style="font-size: 13.5px; font-weight: 600; color: #4A4254;">{{ totalLabel }}</div>
        </div>
        <sc-for list="{{ totals }}" as="t" hint-placeholder-count="6">
          <div style="box-sizing: border-box; width: 92px; flex-shrink: 0; padding: 12px 6px; text-align: center;">
            <div style="font-size: 16px; font-weight: 700; color: #43307A; font-variant-numeric: tabular-nums;">{{ t.n }}</div>
          </div>
        </sc-for>
        <div style="box-sizing: border-box; width: 104px; flex-shrink: 0; padding: 12px 8px; text-align: center;">
          <div style="font-size: 16px; font-weight: 700; color: #43307A; font-variant-numeric: tabular-nums; white-space: nowrap;">{{ grand }} ₪</div>
        </div>
        <div style="flex-grow: 1;"></div>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
/* ═══ העמודות לפי קטגוריה ═══
   כל קטגוריה מגדירה את הפריטים שלה. להוסיף קטגוריה = להוסיף רשומה כאן. */
const CATS = {
  cous: {
    name: 'שלישי של קוסקוס',
    hue: '#7B5CBC', deep: '#43307A',
    items: [
      { id: 'veg',   t: 'מנה',    sub: 'צמחונית', price: 45, quota: 40 },
      { id: 'chick', t: 'מנה',    sub: 'עוף',     price: 55, quota: 30 },
      { id: 'mafr',  t: 'מנה',    sub: 'מפרום',   price: 65, quota: 30 },
      { id: 'aVeg',  t: 'תוספת',  sub: 'ירקות',   price: 10 },
      { id: 'aChick',t: 'תוספת',  sub: 'עוף',     price: 15 },
      { id: 'aMafr', t: 'תוספת',  sub: 'מפרום',   price: 20 }
    ]
  }
};

/* מסלול המצבים · הצבע של השורה כולה נגזר ממנו */
const FLOW = ['חדשה', 'מוכנה', 'נמסרה'];
const BAND = {
  'חדשה':  { row: 'rgba(199,125,62,0.13)',  edge: '#C77D3E', ink: '#7A4A18', muted: '#9A6B3C' },
  'מוכנה': { row: 'rgba(78,138,100,0.13)',  edge: '#4E8A64', ink: '#2F5C42', muted: '#5C8A6E' },
  'נמסרה': { row: 'rgba(130,112,162,0.08)', edge: '#B3ABBD', ink: '#8A8194', muted: '#A79FB2' }
};

/* ⚠ הזמנות הדגמה · נכתבו על ידי Claude */
const SEED = [
  { who: 'דנה כהן',    time: '11:40', ship: 'pickup', pay: 'ביט',      status: 'מוכנה', note: '',
    q: { veg: 2, chick: 0, mafr: 1, aVeg: 1, aChick: 0, aMafr: 0 } },
  { who: 'מיכל אברהם', time: '12:00', ship: 'pickup', pay: 'ביט',      status: 'חדשה',  note: 'וואטסאפ',
    q: { veg: 0, chick: 2, mafr: 2, aVeg: 1, aChick: 0, aMafr: 0 } },
  { who: 'יעל לוי',    time: '12:20', ship: 'pickup', pay: 'אפל פיי',  status: 'חדשה',  note: '',
    q: { veg: 3, chick: 0, mafr: 0, aVeg: 0, aChick: 0, aMafr: 0 } },
  { who: 'אורית ברק',  time: '12:40', ship: 'pickup', pay: 'מזומן',    status: 'נמסרה', note: '',
    q: { veg: 1, chick: 1, mafr: 0, aVeg: 0, aChick: 1, aMafr: 0 } },
  { who: 'שירה מזרחי', time: '13:10', ship: 'pickup', pay: 'ביט',      status: 'חדשה',  note: '',
    q: { veg: 0, chick: 4, mafr: 0, aVeg: 2, aChick: 0, aMafr: 1 } },
  { who: 'רונית שגב',  time: '12:00', ship: 'deliv',  pay: 'מזומן',    status: 'חדשה',  note: 'ויצמן 8, רחובות',
    q: { veg: 2, chick: 2, mafr: 0, aVeg: 0, aChick: 0, aMafr: 0 } },
  { who: 'נועה פרץ',   time: '12:20', ship: 'deliv',  pay: 'פייבוקס',  status: 'מוכנה', note: 'הרצל 14, יבנה',
    q: { veg: 0, chick: 0, mafr: 4, aVeg: 1, aChick: 0, aMafr: 2 } },
  { who: 'טל אבידן',   time: '13:00', ship: 'deliv',  pay: 'ביט',      status: 'חדשה',  note: 'בילו 3, גדרה',
    q: { veg: 4, chick: 0, mafr: 0, aVeg: 0, aChick: 2, aMafr: 0 } },
  { who: 'ליאת דוד',   time: '13:40', ship: 'deliv',  pay: 'ביט',      status: 'נמסרה', note: 'הבנים 2, נס ציונה',
    q: { veg: 1, chick: 1, mafr: 1, aVeg: 1, aChick: 1, aMafr: 1 } }
];

const toMin = (t) => {
  const p = String(t).split(':');
  return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    /* עותק עמוק · כדי שעדכון כמות לא ידרוס את נתוני הזרע */
    this.state = {
      mode: 'pickup',
      orders: SEED.map((o) => Object.assign({}, o, { q: Object.assign({}, o.q), gone: false }))
    };
  }

  cat() { return CATS.cous; }

  /* שינוי כמות · מתגלגל לסה״כ ולמונה המלאי באותו רגע */
  bump(i, id, d) {
    const orders = this.state.orders.map((o, k) => {
      if (k !== i) return o;
      const q = Object.assign({}, o.q);
      q[id] = Math.max(0, (q[id] || 0) + d);
      return Object.assign({}, o, { q: q });
    });
    this.setState({ orders: orders });
  }

  advance(i) {
    const cur = this.state.orders[i].status;
    const k = FLOW.indexOf(cur);
    if (k < 0 || k >= FLOW.length - 1) return;
    const orders = this.state.orders.map((o, n) =>
      n === i ? Object.assign({}, o, { status: FLOW[k + 1] }) : o);
    this.setState({ orders: orders });
  }

  /* הסרת הזמנה · המנות חוזרות למלאי כי הספירה נגזרת מהשורות */
  drop(i) {
    const orders = this.state.orders.map((o, n) =>
      n === i ? Object.assign({}, o, { gone: true }) : o);
    this.setState({ orders: orders });
  }

  sumOf(o) {
    return this.cat().items.reduce((s, it) => s + (o.q[it.id] || 0) * it.price, 0);
  }

  renderVals() {
    const st = this.state;
    const cat = this.cat();
    const live = st.orders.filter((o) => !o.gone);

    /* מיון · קודם לפי קבוצת מצב, ובתוכה לפי שעת האיסוף */
    const inMode = live
      .map((o, i) => ({ o: o, i: st.orders.indexOf(o) }))
      .filter((x) => x.o.ship === st.mode)
      .sort((a, b) => {
        const g = FLOW.indexOf(a.o.status) - FLOW.indexOf(b.o.status);
        return g !== 0 ? g : toMin(a.o.time) - toMin(b.o.time);
      });

    const cols = [{ t: 'שעת איסוף', w: '96px', align: 'center', hasSub: false, sub: '' },
                  { t: 'שם מלא',    w: '186px', align: 'right',  hasSub: false, sub: '' }]
      .concat(cat.items.map((it) => ({ t: it.t, sub: it.sub, hasSub: true, w: '92px', align: 'center' })))
      .concat([{ t: 'סה״כ', w: '104px', align: 'center', hasSub: false, sub: '' },
               { t: 'תשלום', w: '104px', align: 'center', hasSub: false, sub: '' }]);

    const rows = inMode.map((x) => {
      const o = x.o, i = x.i;
      const b = BAND[o.status];
      const k = FLOW.indexOf(o.status);
      const last = k >= FLOW.length - 1;
      return {
        time: o.time, who: o.who, pay: o.pay,
        note: o.note || (o.ship === 'pickup' ? 'איסוף' : 'משלוח'),
        rowBg: b.row, edge: b.edge, ink: b.ink, muted: b.muted,
        sum: this.sumOf(o),
        cells: cat.items.map((it) => {
          const n = o.q[it.id] || 0;
          return {
            n: n,
            fg: n > 0 ? b.ink : '#C4BDCE',
            w: n > 0 ? '700' : '400',
            downOp: n > 0 ? '1' : '0.3',
            upBg: 'rgba(123,92,188,0.13)', upInk: '#43307A',
            bump: () => this.bump(i, it.id, 1),
            down: () => this.bump(i, it.id, -1)
          };
        }),
        nextLabel: last ? 'נמסרה' : 'סמני כ' + FLOW[k + 1],
        nextBg: last ? 'transparent' : 'rgba(255,255,255,0.8)',
        nextBd: last ? 'transparent' : 'rgba(130,112,162,0.28)',
        nextFg: last ? '#A79FB2' : '#43307A',
        nextCur: last ? 'default' : 'pointer',
        advance: () => this.advance(i),
        drop: () => this.drop(i)
      };
    });

    /* סכומי העמודות · מהשורות שמוצגות כרגע */
    const totals = cat.items.map((it) =>
      ({ n: inMode.reduce((s, x) => s + (x.o.q[it.id] || 0), 0) }));
    const grand = inMode.reduce((s, x) => s + this.sumOf(x.o), 0);

    /* המלאי · נספר על פני שני הטאבים, כי המכסה היומית משותפת */
    const stock = cat.items.filter((it) => it.quota).map((it) => {
      const used = live.reduce((s, o) => s + (o.q[it.id] || 0), 0);
      const leftN = it.quota - used;
      const low = leftN <= 5;
      return {
        k: it.sub, left: leftN, of: 'מתוך ' + it.quota,
        fg: leftN <= 0 ? '#B95349' : low ? '#A65E2A' : '#43307A',
        bg: leftN <= 0 ? 'rgba(185,83,73,0.09)' : low ? 'rgba(199,125,62,0.1)' : 'rgba(255,255,255,0.72)',
        bd: leftN <= 0 ? 'rgba(185,83,73,0.3)' : low ? 'rgba(199,125,62,0.32)' : 'rgba(255,255,255,0.9)'
      };
    });

    const count = (m) => live.filter((o) => o.ship === m).length;
    const modes = [{ id: 'pickup', name: 'איסוף' }, { id: 'deliv', name: 'משלוחים' }].map((m) => {
      const on = st.mode === m.id;
      return {
        name: m.name, count: count(m.id),
        bg: on ? '#FFFFFF' : 'transparent',
        shadow: on ? '0 4px 10px -5px rgba(96,80,132,0.5)' : 'none',
        fg: on ? '#43307A' : '#8A8194',
        w: on ? '600' : '400',
        pillBg: on ? 'rgba(123,92,188,0.14)' : 'rgba(130,112,162,0.1)',
        pillFg: on ? '#43307A' : '#8A8194',
        pick: () => this.setState({ mode: m.id })
      };
    });

    return {
      title: cat.name,
      sub: 'שלישי · 25 באוגוסט · ניהול בזמן אמת',
      goBack: () => {},
      modes: modes,
      stock: stock,
      cols: cols,
      rows: rows,
      isEmpty: rows.length === 0,
      emptyLabel: 'אין הזמנות בטאב הזה',
      totals: totals,
      grand: grand,
      totalLabel: 'סה״כ בטאב'
    };
  }
}
</script>
</body>
</html>

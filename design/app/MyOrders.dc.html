<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7B5CBC; } a:hover { color: #6B4FA8; }
    .press { transition: transform 160ms ease; }
    .press:active { transform: scale(0.97); }
    .chev { transition: transform 300ms cubic-bezier(.22,.9,.28,1); }
  </style>
</helmet>

<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FCFBFB; color: #2A2430; font-family: 'Assistant', system-ui, sans-serif; overflow: hidden;">

  <div style="position: absolute; inset: 0; background-image: radial-gradient(56% 36% at 10% 4%, rgba(186,166,228,0.07) 0%, rgba(186,166,228,0) 62%), radial-gradient(50% 32% at 92% 12%, rgba(246,180,172,0.05) 0%, rgba(246,180,172,0) 66%), radial-gradient(58% 38% at 84% 72%, rgba(176,216,190,0.05) 0%, rgba(176,216,190,0) 62%);"></div>

  <div style="position: relative; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; padding: 30px 18px 0;">

    <div style="flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 6px 18px;">
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <div style="font-weight: 600; font-size: 21px; letter-spacing: -0.01em;">ההזמנות שלי</div>
        <sc-if value="{{ hasAny }}" hint-placeholder-val="{{ true }}"><div style="font-weight: 300; font-size: 13px; color: #8A8194;">{{ countLabel }}</div></sc-if>
      </div>
      <div style="position: relative; width: 44px; height: 44px; flex-shrink: 0;">
        <div style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #FFFFFF 0%, #FAF7FD 45%, #EFEAF7 100%); box-shadow: inset -3px -4px 8px rgba(150,125,190,0.16), inset 2px 3px 6px rgba(255,255,255,0.95), 0 6px 13px -9px rgba(120,95,170,0.4);"></div>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8A8194" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
      </div>
    </div>

    <!-- ═══ אין עדיין הזמנות ═══ -->
    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ true }}"><div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 0 30px 150px;">
      <div style="position: relative; width: 116px; height: 116px;">
        <div style="position: absolute; inset: -14px; border-radius: 50%; filter: blur(10px); background: radial-gradient(closest-side, rgba(123,92,188,0.3) 0%, rgba(123,92,188,0.1) 52%, rgba(123,92,188,0) 78%);"></div>
        <div style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 30% 22%, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0) 28%), radial-gradient(circle at 34% 28%, #FFFFFF 0%, rgba(123,92,188,0.07) 38%, rgba(123,92,188,0.26) 100%); box-shadow: inset -8px -10px 20px rgba(123,92,188,0.22), inset 6px 7px 16px rgba(255,255,255,0.98), 0 12px 26px -14px rgba(123,92,188,0.55);"></div>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#43307A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 9h6"></path></svg>
        </div>
      </div>

      <div style="font-weight: 700; font-size: 22px; line-height: 1.35; text-align: center; letter-spacing: -0.015em;">עוד לא הוזמנה התמכרות חדשה 😝</div>

      <div onClick="{{ goHome }}" class="press" style="height: 50px; padding: 0 30px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; gap: 8px; background: linear-gradient(160deg, #D2C2F2 0%, #B9A4E4 100%); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.6), 0 12px 24px -16px rgba(96,80,132,0.9);">
        <div style="font-weight: 600; font-size: 15px; color: #43307A; white-space: nowrap;">{{ emptyCta }}</div>
      </div>
    </div></sc-if>

    <!-- ═══ רשימת ההזמנות ═══ -->
    <sc-if value="{{ hasAny }}" hint-placeholder-val="{{ true }}"><div style="flex-grow: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 11px;">

      <sc-for list="{{ live }}" as="o" hint-placeholder-count="1">
        <div onClick="{{ o.toggle }}" class="press" style="flex-shrink: 0; box-sizing: border-box; border-radius: 26px; padding: 16px 18px; cursor: pointer; border-right: 3px solid {{ o.hue }}; background: linear-gradient(150deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.46) 100%); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); border-top: 1px solid rgba(255,255,255,0.78); border-bottom: 1px solid rgba(255,255,255,0.78); border-left: 1px solid rgba(255,255,255,0.78); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.95), 0 18px 36px -26px rgba(96,80,132,0.55); display: flex; flex-direction: column; gap: 12px;">

          <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
            <div style="min-width: 0; display: flex; flex-direction: column; gap: 5px;">
              <div style="display: flex; align-items: center; gap: 7px;">
                <div style="width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: #4E8A64;"></div>
                <div style="font-size: 10.5px; letter-spacing: 0.18em; font-weight: 700; color: #4E8A64;">{{ o.status }}</div>
              </div>
              <div style="font-weight: 600; font-size: 19px; letter-spacing: -0.015em; line-height: 1.2;">{{ o.name }}</div>
            </div>
            <div style="flex-shrink: 0; display: flex; align-items: center; gap: 9px;">
              <div style="font-weight: 600; font-size: 20px; white-space: nowrap; font-variant-numeric: tabular-nums;">{{ o.sum }} ₪</div>
              <svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#A79FB2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; transform: {{ o.spin }};"><path d="M6 9l6 6 6-6"></path></svg>
            </div>
          </div>

          <sc-if value="{{ o.open }}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 9px;">
            <div style="height: 1px; background: rgba(130,112,162,0.14);"></div>
            <sc-for list="{{ o.rows }}" as="r" hint-placeholder-count="4">
              <div style="display: flex; align-items: flex-start; gap: 10px;">
                <div style="flex-shrink: 0; width: 84px; font-size: 12px; font-weight: 300; color: #7D7488; line-height: 1.55;">{{ r.k }}</div>
                <div style="flex-grow: 1; min-width: 0; font-size: 12.5px; font-weight: 500; color: #2A2430; line-height: 1.55;">{{ r.v }}</div>
              </div>
            </sc-for>
          </div></sc-if>
        </div>
      </sc-for>

      <div style="flex-shrink: 0; padding: 8px 8px 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #A79FB2;">{{ pastLabel }}</div>

      <sc-for list="{{ past }}" as="o" hint-placeholder-count="2">
        <div onClick="{{ o.toggle }}" class="press" style="flex-shrink: 0; box-sizing: border-box; border-radius: 22px; padding: 15px 18px; cursor: pointer; border-right: 3px solid {{ o.edge }}; background: linear-gradient(150deg, rgba(255,255,255,0.56) 0%, rgba(255,255,255,0.32) 100%); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%); border-top: 1px solid rgba(255,255,255,0.62); border-bottom: 1px solid rgba(255,255,255,0.62); border-left: 1px solid rgba(255,255,255,0.62); box-shadow: inset 0 1px 0 rgba(255,255,255,0.86), 0 12px 26px -24px rgba(96,80,132,0.45); display: flex; flex-direction: column; gap: 11px;">

          <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
            <div style="min-width: 0; display: flex; flex-direction: column; gap: 4px;">
              <div style="font-size: 10.5px; letter-spacing: 0.18em; font-weight: 600; color: #A79FB2;">{{ o.status }}</div>
              <div style="font-weight: 600; font-size: 17px; letter-spacing: -0.01em; line-height: 1.2;">{{ o.name }}</div>
            </div>

            <div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 7px;">
              <div style="display: flex; align-items: center; gap: 9px;">
                <div style="font-weight: 600; font-size: 17px; color: #6E6478; white-space: nowrap; font-variant-numeric: tabular-nums;">{{ o.sum }} ₪</div>
                <svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#A79FB2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; transform: {{ o.spin }};"><path d="M6 9l6 6 6-6"></path></svg>
              </div>
              <div onClick="{{ o.again }}" class="press" style="height: 32px; padding: 0 13px; border-radius: 999px; cursor: pointer; background: linear-gradient(160deg, #D2C2F2 0%, #B9A4E4 100%); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.6), 0 8px 16px -13px rgba(96,80,132,0.9); display: flex; align-items: center; gap: 6px;">
                <div style="font-weight: 600; font-size: 12.5px; color: #43307A; white-space: nowrap;">להזמין שוב</div>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#43307A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
              </div>
            </div>
          </div>

          <sc-if value="{{ o.open }}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 9px;">
            <div style="height: 1px; background: rgba(130,112,162,0.14);"></div>
            <sc-for list="{{ o.rows }}" as="r" hint-placeholder-count="4">
              <div style="display: flex; align-items: flex-start; gap: 10px;">
                <div style="flex-shrink: 0; width: 84px; font-size: 12px; font-weight: 300; color: #7D7488; line-height: 1.55;">{{ r.k }}</div>
                <div style="flex-grow: 1; min-width: 0; font-size: 12.5px; font-weight: 500; color: #2A2430; line-height: 1.55;">{{ r.v }}</div>
              </div>
            </sc-for>
          </div></sc-if>
        </div>
      </sc-for>

      <div style="flex-shrink: 0; height: 108px;"></div>
    </div></sc-if>

  </div>

  <div style="position: absolute; bottom: 26px; right: 18px; left: 18px; height: 68px; border-radius: 999px; background: linear-gradient(152deg, rgba(255,255,255,0.66) 0%, rgba(255,255,255,0.44) 100%); backdrop-filter: blur(34px) saturate(200%); -webkit-backdrop-filter: blur(34px) saturate(200%); border: 1px solid rgba(255,255,255,0.75); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.95), 0 18px 34px -18px rgba(96,80,132,0.6); display: flex; align-items: center; justify-content: space-around; padding: 0 10px;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 62px; height: 56px; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#918A9E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <div style="font-size: 11px; color: #918A9E;">בית</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 62px; height: 56px; cursor: pointer; border-radius: 999px; background: rgba(155,127,212,0.13);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7B5CBC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
      <div style="font-size: 11px; font-weight: 700; color: #7B5CBC;">הזמנות</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 62px; height: 56px; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#918A9E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"></path></svg>
      <div style="font-size: 11px; color: #918A9E;">אזור אישי</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"empty":{"editor":"boolean","default":false,"tsType":"boolean"},"$preview":{"width":390,"height":844}}'>
/* גוון הקטגוריה · אותם חמישה גוונים של כל האפליקציה */
const HUES = {
  cous:  { hue: '#7B5CBC', deep: '#43307A', rgb: '123,92,188' },
  schn:  { hue: '#416D9E', deep: '#2B4A6E', rgb: '65,109,158'  },
  box:   { hue: '#437C59', deep: '#2C5A3E', rgb: '67,124,89'   },
  fruit: { hue: '#B04A76', deep: '#7A2E4E', rgb: '176,74,118'  },
  chef:  { hue: '#A85A28', deep: '#7A3D18', rgb: '168,90,40'   }
};

/* ההזמנות · live היא ההזמנה שעוד בתהליך.
   ⚠ when / pay / ref בהזמנות שהסתיימו הם ערכי הדגמה שנכתבו על ידי Claude. */
const ORDERS = [
  { key: 'cous', live: true,  status: 'בהכנה',      name: 'שלישי של קוסקוס',
    items: '2 × צמחוני · 1 × עם 2 יח׳ מפרום', sum: 145,
    when: 'איסוף היום · 12:30', pay: 'ביט', ref: '2508-1471' },
  { key: 'schn', live: false, status: 'נאסף · 15.8', name: 'שישניצל',
    items: '2 חלות · שניצל דק', sum: 110,
    when: 'איסוף · 15.8, 11:40', pay: 'ביט', ref: '1508-1362' },
  { key: 'cous', live: false, status: 'נאסף · 11.8', name: 'שלישי של קוסקוס',
    items: '3 × עם ירך עוף מתוק', sum: 165,
    when: 'איסוף · 11.8, 13:10', pay: 'אפל פיי', ref: '1108-1289' }
];

const a = (rgb, alpha) => 'rgba(' + rgb + ',' + alpha + ')';

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: -1 };     /* איזו הזמנה פתוחה · -1 = כולן סגורות */
  }

  /* לחיצה על הזמנה פותחת אותה וסוגרת את השאר */
  toggle(i) { this.setState({ open: this.state.open === i ? -1 : i }); }

  renderVals() {
    const open = this.state.open;

    const dress = (o, i) => {
      const h = HUES[o.key] || HUES.cous;
      const isOpen = open === i;
      return {
        status: o.status, name: o.name, sum: o.sum,
        hue: h.hue, deep: h.deep,
        edge: a(h.rgb, 0.34),          /* הזמנה שהסתיימה · הגוון מרומז בלבד */
        open: isOpen,
        spin: isOpen ? 'rotate(180deg)' : 'rotate(0deg)',
        rows: [
          { k: 'הפריטים', v: o.items },
          { k: 'מועד', v: o.when },
          { k: 'תשלום', v: o.pay },
          { k: 'מספר הזמנה', v: o.ref }
        ],
        toggle: () => this.toggle(i),
        again: () => {}
      };
    };

    const rows = ORDERS.map(dress);
    const live = this.props.empty ? [] : rows.filter((r, i) => ORDERS[i].live);
    const past = this.props.empty ? [] : rows.filter((r, i) => !ORDERS[i].live);
    const any  = live.length + past.length > 0;

    return {
      live: live,
      past: past,
      isEmpty: !any,
      hasAny: any,
      countLabel: live.length
        ? live.length + ' פעילה · ' + past.length + ' קודמות'
        : past.length + ' הזמנות קודמות',
      pastLabel: 'הזמנות קודמות',
      emptyCta: 'מה יש היום',
      goHome: () => {}
    };
  }
}
</script>
</body>
</html>

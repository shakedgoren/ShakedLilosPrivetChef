<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;500;600;700&amp;family=Anton&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #7B5CBC; } a:hover { color: #6B4FA8; }

    /* ── ליקוויד גלאס · שתי כתמי אור שנעים לאט מתחת לזכוכית ── */
    @keyframes lgDriftA {
      0%   { transform: translate3d(-6%, -4%, 0) scale(1); }
      50%  { transform: translate3d(10%, 6%, 0) scale(1.12); }
      100% { transform: translate3d(-6%, -4%, 0) scale(1); }
    }
    @keyframes lgDriftB {
      0%   { transform: translate3d(8%, 10%, 0) scale(1.06); }
      50%  { transform: translate3d(-9%, -6%, 0) scale(1); }
      100% { transform: translate3d(8%, 10%, 0) scale(1.06); }
    }
    /* הברק שחולף על שפת הזכוכית */
    @keyframes lgSheen {
      0%, 62%  { transform: translateX(-140%) rotate(14deg); opacity: 0; }
      70%      { opacity: 0.55; }
      100%     { transform: translateX(240%) rotate(14deg); opacity: 0; }
    }
    .lg-a { animation: lgDriftA 22s ease-in-out infinite; }
    .lg-b { animation: lgDriftB 28s ease-in-out infinite; }
    .lg-sheen { animation: lgSheen 9s ease-in-out infinite; }


    /* ── הכותרת · זהב ישר על הרקע, צמודה לקצה העליון ──
       ה-margin השלילי מבטל את ריפוד ה-30px של המסך, והריפוד הפנימי
       של 22px מפצה חלקית על שעון המערכת. בפיתוח יוחלף ב-safe-area. */
    .band {
      margin: -30px -18px 0;
      padding: 22px 18px 12px;
      background: transparent;
      display: flex; align-items: center; gap: 10px; position: relative;
    }
    .band-mark {
      font-family: 'Anton', 'Assistant', system-ui, sans-serif;
      font-size: 26px; line-height: 1; letter-spacing: 0.05em;
      /* אותו זהב מטאלי של הלוגו · הועמק כדי להיקרא על רקע בהיר */
      background: linear-gradient(96deg, #8A6A1F 0%, #D4AF37 34%, #C9A227 58%, #8A6A1F 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: #A9812A;
    }
    /* הקו בין הכותרת לשורה · קצר וממורכז, רחוק מכפתור ההתחברות */
    .band-sub {
      position: relative;
      font-size: 10.5px; font-weight: 400; letter-spacing: 0.09em;
      color: #9C7F3F; margin-top: 11px; padding-top: 9px;
    }
    .band-sub::before {
      content: ""; position: absolute; top: 0; left: 50%;
      transform: translateX(-50%); width: 196px; height: 1px;
      background: linear-gradient(90deg, rgba(201,162,39,0), rgba(201,162,39,0.75), rgba(201,162,39,0));
    }

    /* ── קרוסלת התמונות · נעה מעצמה, בלולאה אינסופית ── */
    @keyframes reelRun { from { transform: translateX(0); } to { transform: translateX(50%); } }
    .reel-track { animation: reelRun 34s linear infinite; }
    .reel:hover .reel-track { animation-play-state: paused; }
    @media (prefers-reduced-motion: reduce) { .reel-track { animation: none; } }

    /* ── הפתיחה של תמונה ── */
    @keyframes shotIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
    .shot { animation: shotIn 320ms cubic-bezier(.22,.9,.28,1) both; }

    /* השורה שמוקלדת כרגע · הסמן מהבהב */
    @keyframes caret { 50% { opacity: 0.25; } }
    .story { -webkit-user-select: none; user-select: none; }

  </style>
</helmet>

<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FCFBFB; color: #2A2430; font-family: 'Assistant', system-ui, sans-serif; overflow: hidden;">

  <sc-if value="{{ aboutOpen }}" hint-placeholder-val="{{ false }}"><div onClick="{{ closeAbout }}" style="position: absolute; inset: 0; z-index: 40; background: rgba(42,36,48,0.42); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);"></div><div style="position: absolute; z-index: 41; top: 60px; bottom: 60px; right: 16px; left: 16px; border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; text-align: right; background: {{ popBg }}; border: 1px solid rgba(255,255,255,0.72); box-shadow: inset 0 2px 0 rgba(255,255,255,0.95), 0 30px 60px -28px rgba(60,48,84,0.7);"><div style="flex-shrink: 0; padding: 20px 22px 14px; display: flex; align-items: flex-start; gap: 12px;"><div style="flex-grow: 1; font-weight: 600; font-size: 19px; line-height: 1.25; text-align: center; padding-right: 32px;">נעים להכיר, אני שקד לילוז 👋</div><div onClick="{{ closeAbout }}" style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.75); box-shadow: 0 2px 6px -3px rgba(90,74,120,0.5);"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6E6478" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></div></div><div class="story" onClick="{{ finishType }}" style="flex-grow: 1; overflow-y: auto; padding: 0 22px 24px; display: flex; flex-direction: column; gap: 15px; text-align: center; cursor: default;"><sc-for list="{{ blocks }}" as="b" hint-placeholder-count="8"><sc-if value="{{ b.isRule }}" hint-placeholder-val="{{ true }}"><div style="height: 1px; background: {{ popRule }};"></div></sc-if><sc-if value="{{ b.isText }}" hint-placeholder-val="{{ true }}"><div style="font-weight: {{ b.w }}; font-size: {{ b.size }}; color: {{ b.fg }};"><sc-for list="{{ b.lines }}" as="l" hint-placeholder-count="4"><div style="min-height: {{ l.lh }}; line-height: {{ l.lh }};">{{ l.t }}{{ l.cursor }}</div></sc-for></div></sc-if></sc-for><sc-if value="{{ typing }}" hint-placeholder-val="{{ true }}"><div style="font-size: 11px; font-weight: 400; letter-spacing: 0.05em; color: #C4BDCE; padding-top: 4px;">{{ skipLabel }}</div></sc-if></div></div></sc-if>

  <!-- ═══ תמונה פתוחה · הכל מאחור מטושטש ═══ -->
  <sc-if value="{{ shotOpen }}" hint-placeholder-val="{{ false }}"><div onClick="{{ closeShot }}" style="position: absolute; inset: 0; z-index: 50; background: rgba(28,23,20,0.5); backdrop-filter: blur(16px) saturate(120%); -webkit-backdrop-filter: blur(16px) saturate(120%);"></div>
  <div style="position: absolute; z-index: 51; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 24px; pointer-events: none;">
    <div style="text-align: center;">
      <div style="font-size: 24px; font-weight: 700; letter-spacing: -0.01em; color: #FFFFFF; text-shadow: 0 2px 10px rgba(20,16,12,0.5);">{{ shotName }}</div>
      <div style="font-size: 13px; font-weight: 300; color: rgba(255,255,255,0.78); margin-top: 3px;">{{ shotSub }}</div>
    </div>
    <div class="shot" style="width: 100%; height: 400px; border-radius: 26px; background-image: {{ shotImg }}; background-size: cover; background-position: center; background-color: {{ shotTint }}; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 30px 60px -28px rgba(20,16,12,0.9);"></div>
  </div>
  <div onClick="{{ closeShot }}" class="press" style="position: absolute; z-index: 52; left: 18px; top: 30px; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.34); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
  </div></sc-if>



<div style="position: relative; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; padding: 30px 18px 0;">

    </div><div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 20px;"><div onClick="{{ noop }}" class="press" style="flex-shrink: 0; width: 250px; height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; box-sizing: border-box; background: linear-gradient(104deg, #CCBAF0 0%, #BCA7E6 58%, #C6B3EB 100%); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.6), inset 0 -2.5px 5px rgba(118,92,174,0.28), 0 10px 20px -12px rgba(118,92,174,0.65);"><div style="position: absolute; left: 4px; top: 4px; width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(180deg, #FFFFFF 0%, #F6F3FA 100%); box-shadow: inset 0 1.5px 0 #FFFFFF, 0 4px 9px -4px rgba(90,70,140,0.55); display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4B3B78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></div><div style="font-size: 20px; font-weight: 600; color: #FFFFFF; white-space: nowrap;">מתחילים את המסע</div></div><div onClick="{{ noop }}" class="press" style="flex-shrink: 0; width: 250px; height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; box-sizing: border-box; background: linear-gradient(180deg, #FFFFFF 0%, #FBF8F8 100%); box-shadow: inset 0 1.5px 0 #FFFFFF, inset 0 -2px 4px rgba(150,132,178,0.12), 0 8px 18px -12px rgba(120,100,150,0.6);"><div style="font-size: 20px; font-weight: 600; color: #6E6480; white-space: nowrap;">להתחברות</div></div></div><div class="reel" style="flex-shrink: 0; width: 100%; min-width: 0; margin-top: 10px; border-radius: 18px; overflow: hidden;">

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
/* rgb — הגוון של כל נושא כשלושה מספרים, כדי לגזור ממנו את כל השקיפויות */
const ITEMS = [
  { key: 'cous',  num: '01', title: 'קוסקוס', sub: 'שלישי של קוסקוס', short: 'קוסקוס', tag: 'כל שלישי',
    desc: 'קוסקוס עננים ביתי שמוכן באהבה, בדיוק כמו של פעם.',
    hue: '#7B5CBC', rgb: '123,92,188', cta: 'להזמנה ' },
  { key: 'schn',  num: '02', title: 'שישניצל', sub: 'שישי של מטעמים', short: 'שישניצל', tag: 'כל שישי',
    desc: 'שניצל דק וקריספי בחלה ביתית רכה, לצד שלל תוספות.',
    hue: '#416D9E', rgb: '65,109,158', cta: 'להזמנת שישניצל' },
  { key: 'box',   num: '03', title: 'ספיישל', sub: 'מארזי ספיישל', short: 'ספיישל', tag: 'לכל אירוע',
    desc: 'ארוזים בארגז עץ עם פרחי גיבסניות. המתנה המושלמת לאהובים שלכם.',
    hue: '#437C59', rgb: '67,124,89', cta: 'לבחירת מארז' },
  { key: 'fruit', num: '04', title: 'פירות', sub: 'מגשי פירות', short: 'פירות', tag: 'בעבודת יד',
    desc: 'פירות טריים שנחתכים ביום ההזמנה ומעוצבים בעבודת יד.',
    hue: '#B04A76', rgb: '176,74,118', cta: 'לבחירת מגש' },
  { key: 'chef',  num: '05', title: 'שף וטאבון', sub: 'ארוחת שף ועמדת טאבון', short: 'שף', tag: 'חוויה אישית',
    desc: 'חוויה קולינרית שמוגשת בשלבים למרכז השולחן, מנה אחר מנה.',
    hue: '#A85A28', rgb: '168,90,40', cta: 'לבקשת הצעה' }
];

/* המרווח בין שני כרטיסים = רוחב הכרטיס + gap + שוליים.
   נמדד מה-DOM בטעינה, כדי שהוא לא ייצא מסנכרון אם רוחב הכרטיס משתנה בקנבס.
   הערך כאן הוא נפילה לאחור בלבד. */
/* התמונה של כל קטגוריה · הקובץ יושב ב-design/app/assets ונאסף אוטומטית.
   אם הקובץ עדיין לא הועלה, ה-background לא נצבע והאריח נשאר בגוון הקטגוריה. */
const SHOTS = [
  { key: 'cous',  name: 'קוסקוס',      file: 'cat-couscous.jpg' },
  { key: 'schn',  name: 'שישניצל',     file: 'cat-schnitzel.jpg' },
  { key: 'box',   name: 'ספיישל',      file: 'cat-boxes.jpg' },
  { key: 'fruit', name: 'מגשי פירות',  file: 'cat-fruit.jpg' },
  { key: 'chef',  name: 'שף וטאבון',   file: 'cat-chef.jpg' }
];

const CARD_PITCH = 320;
/* כמה צריך להחליק באצבע כדי להעביר כרטיס */
const SWIPE_MIN = 45;
const EASE = 'transform 560ms cubic-bezier(.22,.9,.28,1)';
const a = (rgb, alpha) => 'rgba(' + rgb + ',' + alpha + ')';
const clampIdx = (n) => Math.max(0, Math.min(ITEMS.length - 1, n));

/* ═══ הסיפור האישי ═══
   הטקסט כולו נכתב על ידי שקד · כאן הוא רק מחולק לשורות
   כדי שאפשר יהיה להקליד אותו אות אחר אות. */
const STORY = [
  { k: 'lead', lines: ['שף, קונדיטורית ~ יוצרת רגעים בלתי נשכחים דרך אוכל, אירוח ותשומת לב לכל פרט 👩🏼\u200d🍳'] },
  { k: 'rule', lines: [] },
  { k: 'body', lines: [
    'אוכל בשבילי מעולם לא היה רק מתכון,',
    'הוא דרך לארח,',
    'לשמח,',
    'לחבר אנשים סביב שולחן אחד.'] },
  { k: 'body', lines: [
    'האהבה והתשוקה שלי לעולם הזה הובילה אותי',
    'ללמוד קונדיטוריה בבית הספר Estella,',
    'ובהמשך גם לימודי שף בבית הספר Danon,',
    'שניים מהמוסדות המובילים בישראל בתחום הקולינריה!'] },
  { k: 'body', lines: [
    'ככל שהזמן עבר, הבנתי שיש לי ייעוד בחיים',
    'והוא לשמח אחרים בעזרת האוכל שלי.'] },
  { k: 'body', lines: [
    'מתוך אהבה אמיתית לאוכל, לאירוח',
    'ולרגעים הקטנים שמחברים בין אנשים נולד העסק שלי',
    'מקום שמחבר בין חומרי גלם איכותיים, אהבה לאירוח ותשומת לב לכל פרט קטן,',
    'כדי ליצור חוויות קולינריות שמרגישות אישיות, מוקפדות ובלתי נשכחות!'] },
  { k: 'accent', lines: [
    'כי בשבילי, אוכל הוא אף פעם לא רק אוכל,',
    'הוא הדרך ליצור רגעים שאנשים זוכרים!'] },
  { k: 'body', lines: [
    'אני מזמינה אתכם להיכנס למטבח שלי,',
    'לתת לי להיות חלק מהרגעים המיוחדים שלכם,',
    'ולדאוג שכל מה שיוגש לשולחן יהיה מוקפד, טעים ובעיקר – מכל הלב. ❤️'] }
];

/* אורך הסיפור · לפיו יודעים מתי ההקלדה נגמרה */
const STORY_LEN = STORY.reduce((s, b) => s + b.lines.reduce((n, l) => n + l.length, 0), 0);

/* ═══ קצב ההקלדה · אנושי ולא מטרונום ═══
   מהר בתוך מילה, עצירה קטנה ברווח, נשימה אחרי פסיק ונקודה,
   ומדי פעם היסוס. זה ההבדל בין מכונה לבין מישהי שמקלידה. */
const TYPE_BASE = 11;      /* בסיס לאות */
const TYPE_JIT  = 9;       /* פיזור אקראי */
const PAUSE = { ' ': 30, ',': 120, '.': 200, '!': 200, '?': 200 };
const HESITATE = 0.03;     /* אחוז ההיסוסים */
const HESITATE_MS = 100;
/* הנקישה מושמעת כל אות רביעית · נקישה לכל אות בקצב הזה היא זמזום */
const TICK_EVERY = 4;

/* סופי השורות · שם נשמעת פעמון וחזרת הגררה */
const LINE_ENDS = (function () {
  const ends = [];
  let n = 0;
  STORY.forEach(function (b) {
    b.lines.forEach(function (l) { n += l.length; ends.push(n); });
  });
  return ends;
})();

/* התו שבמיקום מסוים · לפיו נקבעת ההשהיה */
const CHAR_AT = (function () {
  let all = '';
  STORY.forEach(function (b) { b.lines.forEach(function (l) { all += l; }); });
  return all;
})();

const TYPE_STYLE = {
  lead:   { w: '300', size: '13.5px', lh: '23px', fg: '#6E6478' },
  body:   { w: '300', size: '13.5px', lh: '24px', fg: '#6E6478' },
  accent: { w: '400', size: '14px',   lh: '25px', fg: null }
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: 0, aboutOpen: false, typed: 0, shot: -1, pitch: CARD_PITCH, dragDx: 0, dragging: false };
  }

  componentDidMount() {
    this.measurePitch();
    this._onResize = () => this.measurePitch();
    window.addEventListener('resize', this._onResize);
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
    clearTimeout(this._type);
  }

  /* offsetLeft ולא getBoundingClientRect — הכרטיסים הלא־פעילים מוקטנים
     ב-scale, וה-rect שלהם כבר מגלם את ההקטנה. offsetLeft מתעלם מ-transform. */
  measurePitch() {
    const track = document.querySelector('[data-track]');
    if (!track) return;
    const kids = track.children;
    if (kids.length < 2) return;
    const p = Math.abs(kids[1].offsetLeft - kids[0].offsetLeft);
    if (p > 1 && Math.abs(p - this.state.pitch) > 0.5) this.setState({ pitch: p });
  }

  dragStart(e) {
    if (e.pointerType === 'mouse' && e.buttons !== 1) return;
    this._x0 = e.clientX;
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    this.setState({ dragging: true, dragDx: 0 });
  }

  dragMove(e) {
    if (!this.state.dragging) return;
    this.setState({ dragDx: e.clientX - this._x0 });
  }

  /* ב-RTL הכרטיס הבא יושב משמאל, ולכן החלקה ימינה מושכת אותו פנימה */
  dragEnd() {
    if (!this.state.dragging) return;
    const dx = this.state.dragDx;
    let next = this.state.active;
    if (dx > SWIPE_MIN) next = clampIdx(next + 1);
    else if (dx < -SWIPE_MIN) next = clampIdx(next - 1);
    this.setState({ dragging: false, dragDx: 0, active: next });
  }

  /* ── פתיחת תמונה ── */
  openShot(i) { this.setState({ shot: i }); }
  closeShot() { this.setState({ shot: -1 }); }

  /* ── הסיפור נכתב אות אחר אות, עם קליק של מכונת כתיבה ── */
  openAbout() {
    /* הלחיצה הזאת היא מחוות המשתמש שמתירה קול · חייבים לפתוח כאן */
    this.unlock();
    this.setState({ aboutOpen: true, typed: 0 });
    clearTimeout(this._type);
    this.step();
  }

  /* פעימה אחת · האות נוספת וההשהיה הבאה נגזרת ממנה */
  step() {
    const n = this.state.typed + 1;
    if (n > STORY_LEN) return;
    this.setState({ typed: n });

    const ch = CHAR_AT.charAt(n - 1);
    if (LINE_ENDS.indexOf(n) !== -1) this.ding();
    else if (n % TICK_EVERY === 0) this.tick();

    if (n >= STORY_LEN) return;
    let d = TYPE_BASE + Math.random() * TYPE_JIT;
    if (PAUSE[ch]) d += PAUSE[ch];
    if (Math.random() < HESITATE) d += HESITATE_MS;
    this._type = setTimeout(() => this.step(), d);
  }

  closeAbout() {
    clearTimeout(this._type);
    this.setState({ aboutOpen: false, typed: 0 });
  }
  /* לחיצה על הסיפור מסיימת את ההקלדה מיד */
  finishType() {
    clearTimeout(this._type);
    this.setState({ typed: STORY_LEN });
  }
  /* ── הקול ──
     דפדפן פותח AudioContext רק אחרי מחווה של המשתמש, ולכן הוא נפתח
     בלחיצה שפותחת את הסיפור. בלי זה שום דבר לא נשמע. */
  unlock() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!this._ac) {
        this._ac = new AC();
        this._out = this._ac.createGain();
        this._out.gain.value = 0.9;
        this._out.connect(this._ac.destination);
      }
      if (this._ac.state === 'suspended') this._ac.resume();
      /* פעימה אילמת · חלק מהדפדפנים דורשים ניגון בפועל בתוך המחווה */
      const s = this._ac.createBufferSource();
      s.buffer = this._ac.createBuffer(1, 1, this._ac.sampleRate);
      s.connect(this._out);
      s.start(0);
    } catch (e) {}
  }

  /* buffer של רעש לבן · נבנה פעם אחת ומשמש לכל הנקישות */
  noise() {
    if (this._buf) return this._buf;
    const ac = this._ac;
    const len = Math.floor(ac.sampleRate * 0.08);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this._buf = buf;
    return buf;
  }

  /* מכת מקש · פרץ רעש מסונן ומתחתיו החבטה הנמוכה של הפטיש */
  tick() {
    try {
      if (!this._ac) this.unlock();
      const ac = this._ac;
      if (!ac) return;
      if (ac.state === 'suspended') ac.resume();
      const t = ac.currentTime;
      const lift = 0.85 + Math.random() * 0.3;

      const src = ac.createBufferSource();
      src.buffer = this.noise();
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(2200 + Math.random() * 1100, t);
      bp.Q.setValueAtTime(0.9, t);
      const ng = ac.createGain();
      ng.gain.setValueAtTime(0.0001, t);
      ng.gain.exponentialRampToValueAtTime(0.5 * lift, t + 0.002);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.042);
      src.connect(bp); bp.connect(ng); ng.connect(this._out);
      src.start(t); src.stop(t + 0.09);

      const o = ac.createOscillator();
      const og = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(190 + Math.random() * 50, t);
      o.frequency.exponentialRampToValueAtTime(80, t + 0.05);
      og.gain.setValueAtTime(0.0001, t);
      og.gain.exponentialRampToValueAtTime(0.3 * lift, t + 0.003);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      o.connect(og); og.connect(this._out);
      o.start(t); o.stop(t + 0.08);
    } catch (e) { /* דפדפן שחוסם קול · ההקלדה ממשיכה בלעדיו */ }
  }

  /* סוף שורה · פעמון קטן ואחריו חריקת חזרת הגררה */
  ding() {
    try {
      if (!this._ac) this.unlock();
      const ac = this._ac;
      if (!ac) return;
      const t = ac.currentTime;

      [1568, 2093].forEach((f, k) => {
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(k === 0 ? 0.22 : 0.1, t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        o.connect(g); g.connect(this._out);
        o.start(t); o.stop(t + 0.55);
      });

      const src = ac.createBufferSource();
      src.buffer = this.noise();
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(900, t + 0.07);
      bp.frequency.linearRampToValueAtTime(2600, t + 0.2);
      bp.Q.setValueAtTime(1.6, t);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t + 0.07);
      g.gain.exponentialRampToValueAtTime(0.14, t + 0.1);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      src.connect(bp); bp.connect(g); g.connect(this._out);
      src.start(t + 0.07); src.stop(t + 0.26);
    } catch (e) {}
  }

  /* חלוקת התווים שנחשפו עד כה בין השורות */
  storyBlocks() {
    const cur = ITEMS[this.state.active];
    let left = this.state.typed;
    return STORY.map((b) => {
      const st = TYPE_STYLE[b.k] || TYPE_STYLE.body;
      const lines = b.lines.map((text) => {
        const take = Math.max(0, Math.min(text.length, left));
        left -= text.length;
        const typing = take > 0 && take < text.length;
        return { t: text.slice(0, take), cursor: typing ? '▍' : '', lh: st.lh };
      });
      return {
        isRule: b.k === 'rule',
        isText: b.k !== 'rule',
        w: st.w, size: st.size, lh: st.lh,
        fg: st.fg || cur.hue,
        lines: lines
      };
    });
  }

  renderVals() {
    const active = this.state.active;
    const cur = ITEMS[active];

    const dots = ITEMS.map((it, i) => ({
      w: i === active ? '20px' : '6px',
      bg: i === active ? cur.hue : 'rgba(130,112,162,0.2)'
    }));

    return {
      /* אין פרופיל מחובר · האייקון מוביל להתחברות */
      goLogin: () => {},
      trackShift: 'translateX(' + (active * this.state.pitch + this.state.dragDx) + 'px)',
      trackEase: this.state.dragging ? 'none' : EASE,
      dragStart: (e) => this.dragStart(e),
      dragMove: (e) => this.dragMove(e),
      dragEnd: () => this.dragEnd(),
      cta: cur.cta,
      hue: cur.hue,
      /* הרצועה מוכפלת · כך הלולאה נסגרת בלי קפיצה */
      reel: SHOTS.concat(SHOTS).map((sh, i) => {
        const it = ITEMS.filter((x) => x.key === sh.key)[0];
        return {
          name: sh.name,
          img: "url('" + sh.file + "')",
          tint: a(it.rgb, 0.16),
          ink: it.hue,
          open: () => this.openShot(i % SHOTS.length)
        };
      }),

      shotOpen: this.state.shot >= 0,
      closeShot: () => this.closeShot(),
      shotName: this.state.shot >= 0 ? SHOTS[this.state.shot].name : '',
      shotSub: this.state.shot >= 0 ? (ITEMS.filter((x) => x.key === SHOTS[this.state.shot].key)[0] || {}).sub : '',
      shotImg: this.state.shot >= 0 ? "url('" + SHOTS[this.state.shot].file + "')" : 'none',
      shotTint: this.state.shot >= 0
        ? a((ITEMS.filter((x) => x.key === SHOTS[this.state.shot].key)[0] || { rgb: '123,92,188' }).rgb, 0.2)
        : 'transparent',

      aboutOpen: this.state.aboutOpen,
      openAbout: () => this.openAbout(),
      closeAbout: () => this.closeAbout(),
      finishType: () => this.finishType(),
      blocks: this.storyBlocks(),
      typing: this.state.aboutOpen && this.state.typed < STORY_LEN,
      skipLabel: 'לחצי לדילוג',
      aboutBg: 'linear-gradient(150deg, rgba(255,255,255,0.52) 0%, ' + a(cur.rgb, 0.1) + ' 100%)',
      aboutShadow: 'inset 0 1px 0 rgba(255,255,255,0.82), 0 12px 28px -22px ' + a(cur.rgb, 0.5),
      aboutBtnBg: a(cur.rgb, 0.15),
      popBg: 'radial-gradient(120% 60% at 82% 4%, ' + a(cur.rgb, 0.16) + ' 0%, ' + a(cur.rgb, 0) + ' 66%), '
           + 'linear-gradient(160deg, #FEFCFB 0%, #FBF7F5 100%)',
      popRule: a(cur.rgb, 0.24),

      /* כל המסך מקבל נגיעה קלה בגוון הנושא */
      pageWash: 'radial-gradient(76% 44% at 52% 20%, ' + a(cur.rgb, 0.08) + ' 0%, ' + a(cur.rgb, 0) + ' 72%)',
      /* כתמי האור של הזכוכית · נצבעים בגוון הקטגוריה שעל המסך */
      glowA: 'radial-gradient(circle, ' + a(cur.rgb, 0.34) + ' 0%, ' + a(cur.rgb, 0) + ' 70%)',
      glowB: 'radial-gradient(circle, rgba(210,194,242,0.3) 0%, rgba(210,194,242,0) 70%)',

      ctaBg: 'linear-gradient(168deg, ' + a(cur.rgb, 0.34) + ' 0%, ' + a(cur.rgb, 0.52) + ' 100%)',
      ctaShadow: 'inset 0 1.5px 0 rgba(255,255,255,0.6), 0 12px 24px -16px ' + a(cur.rgb, 0.6),
      ctaInk: cur.hue,

      cards: ITEMS.map((it, i) => ({
        num: it.num,
        title: it.title,
        sub: it.sub,
        desc: it.desc,
        hue: it.hue,
        dots: dots,

        /* הזכוכית עצמה נצבעת בגוון הנושא */
        cardBg: 'radial-gradient(128% 96% at 84% 12%, ' + a(it.rgb, 0.24) + ' 0%, ' + a(it.rgb, 0) + ' 68%), '
              + 'linear-gradient(150deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.2) 55%, rgba(255,255,255,0.34) 100%)',
        cardEdge: i === active ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.5)',
        cardShadow: i === active
          ? 'inset 0 2.5px 0 rgba(255,255,255,0.98)'
          + ', inset 0 -2.5px 3px ' + a(it.rgb, 0.22)
          + ', inset 3px 0 3px rgba(255,255,255,0.6)'
          + ', inset -3px 0 4px ' + a(it.rgb, 0.12)
          + ', 0 0 0 1px rgba(255,255,255,0.45)'
          + ', 0 0 40px -6px ' + a(it.rgb, 0.3)
          + ', 0 22px 44px -22px ' + a(it.rgb, 0.6)
          : 'inset 0 1px 0 rgba(255,255,255,0.6), 0 10px 24px -22px ' + a(it.rgb, 0.4),

        orb: 'radial-gradient(circle at 30% 22%, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0) 28%), '
           + 'radial-gradient(circle at 34% 28%, #FFFFFF 0%, ' + a(it.rgb, 0.07) + ' 38%, ' + a(it.rgb, 0.26) + ' 100%)',
        orbShadow: 'inset -8px -10px 20px ' + a(it.rgb, 0.22)
                 + ', inset 6px 7px 16px rgba(255,255,255,0.98)'
                 + ', 0 0 30px -2px ' + a(it.rgb, 0.4)
                 + ', 0 12px 26px -14px ' + a(it.rgb, 0.55),
        glow: 'radial-gradient(closest-side, ' + a(it.rgb, 0.46) + ' 0%, ' + a(it.rgb, 0.16) + ' 52%, ' + a(it.rgb, 0) + ' 78%)',
        contact: 'radial-gradient(closest-side, ' + a(it.rgb, 0.24) + ', ' + a(it.rgb, 0) + ')',
        dash: a(it.rgb, 0.34),
        dashInk: a(it.rgb, 0.72),
        bead: 'radial-gradient(circle at 32% 26%, #FFFFFF 0%, ' + a(it.rgb, 0.1) + ' 42%, ' + a(it.rgb, 0.34) + ' 100%)',
        beadShadow: '0 3px 6px -3px ' + a(it.rgb, 0.6),

        scale: i === active ? 'scale(1)' : 'scale(0.92)',
        dim: i === active ? '1' : '0.35'
      })),

      rail: ITEMS.map((it, i) => {
        const on = i === active;
        return {
          num: it.num,
          short: it.short,
          tag: it.tag,
          pick: () => this.setState({ active: i }),
          isCous:  it.key === 'cous',
          isSchn:  it.key === 'schn',
          isBox:   it.key === 'box',
          isFruit: it.key === 'fruit',
          isChef:  it.key === 'chef',
          numFg: it.hue,
          orb: 'radial-gradient(circle at 30% 22%, rgba(255,255,255,0.96) 0%, rgba(255,255,255,0) 30%), '
             + 'radial-gradient(circle at 34% 28%, #FFFFFF 0%, ' + a(it.rgb, on ? 0.08 : 0.04) + ' 40%, '
             + a(it.rgb, on ? 0.3 : 0.15) + ' 100%)',
          shadow: on
            ? 'inset -4px -5px 11px ' + a(it.rgb, 0.26) + ', inset 3px 4px 8px rgba(255,255,255,0.99)'
              + ', 0 0 22px -2px ' + a(it.rgb, 0.42) + ', 0 10px 20px -10px ' + a(it.rgb, 0.6)
            : 'inset -3px -4px 8px ' + a(it.rgb, 0.12) + ', inset 2px 3px 6px rgba(255,255,255,0.94), 0 5px 11px -9px ' + a(it.rgb, 0.28),
          glow: on
            ? 'radial-gradient(closest-side, ' + a(it.rgb, 0.42) + ' 0%, ' + a(it.rgb, 0.14) + ' 54%, ' + a(it.rgb, 0) + ' 80%)'
            : 'radial-gradient(closest-side, ' + a(it.rgb, 0.14) + ' 0%, ' + a(it.rgb, 0) + ' 76%)',
          lift: on ? 'translateY(-5px) scale(1.07)' : 'translateY(0) scale(1)',
          ink: on ? it.hue : a(it.rgb, 0.55),
          titleFg: on ? '#2A2430' : '#A79FB2',
          titleW: on ? '600' : '400',
          subFg: on ? it.hue : a(it.rgb, 0.5),
          underline: on ? it.hue : 'transparent'
        };
      })
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7B5CBC; } a:hover { color: #6B4FA8; }
    .press { transition: transform 150ms ease; }
    .press:active { transform: scale(0.96); }
    .bar { transition: width 460ms cubic-bezier(.22,.9,.28,1); }
  </style>
</helmet>

<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FCFBFB; color: #2A2430; font-family: 'Assistant', system-ui, sans-serif; overflow: hidden;">

  <div style="position: absolute; inset: 0; background-image: radial-gradient(56% 36% at 10% 4%, rgba(186,166,228,0.08) 0%, rgba(186,166,228,0) 62%), radial-gradient(50% 32% at 92% 12%, rgba(246,180,172,0.05) 0%, rgba(246,180,172,0) 66%);"></div>

  <div style="position: relative; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 30px 18px 0;">

    <div style="flex-shrink: 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
      <div>
        <div style="font-weight: 600; font-size: 21px; letter-spacing: -0.01em;">כספים</div>
        <div style="font-weight: 300; font-size: 12.5px; color: #8A8194; margin-top: 2px;">{{ sub }}</div>
      </div>
    </div>

    <div style="flex-shrink: 0; display: flex; gap: 6px;">
      <sc-for list="{{ periods }}" as="p" hint-placeholder-count="3">
        <div onClick="{{ p.pick }}" class="press" style="flex: 1; box-sizing: border-box; height: 36px; border-radius: 12px; cursor: pointer; background: {{ p.bg }}; border: 1.5px solid {{ p.bd }}; display: flex; align-items: center; justify-content: center;">
          <div style="font-size: 12.5px; font-weight: {{ p.w }}; color: {{ p.fg }}; white-space: nowrap;">{{ p.name }}</div>
        </div>
      </sc-for>
    </div>

    <div style="flex-grow: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 11px;">

      <!-- ═══ מחזור ═══ -->
      <div style="flex-shrink: 0; box-sizing: border-box; border-radius: 22px; padding: 16px 18px; background: linear-gradient(152deg, rgba(210,194,242,0.5) 0%, rgba(185,164,228,0.36) 100%); border: 1px solid rgba(255,255,255,0.7); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.9), 0 16px 32px -26px rgba(96,80,132,0.7);">
        <div style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; color: #5B4794;">{{ revLabel }}</div>
        <div style="display: flex; align-items: baseline; gap: 6px; margin-top: 5px;">
          <div style="font-size: 34px; font-weight: 700; color: #43307A; font-variant-numeric: tabular-nums; letter-spacing: -0.02em;">{{ rev }}</div>
          <div style="font-size: 15px; font-weight: 500; color: #5B4794;">₪</div>
        </div>
        <div style="font-size: 12px; font-weight: 500; color: #5B4794; margin-top: 3px;">{{ revSub }}</div>
      </div>

      <!-- ═══ הוצאות ורווח ═══ -->
      <div style="flex-shrink: 0; display: flex; gap: 10px;">
        <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="2">
          <div style="flex: 1; box-sizing: border-box; border-radius: 20px; padding: 14px; background: linear-gradient(150deg, rgba(255,255,255,0.74) 0%, rgba(255,255,255,0.48) 100%); border: 1px solid rgba(255,255,255,0.8); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 12px 26px -24px rgba(96,80,132,0.5);">
            <div style="font-size: 11.5px; font-weight: 500; color: #7D7488;">{{ t.k }}</div>
            <div style="display: flex; align-items: baseline; gap: 3px; margin-top: 4px;">
              <div style="font-size: 22px; font-weight: 700; color: {{ t.fg }}; font-variant-numeric: tabular-nums; letter-spacing: -0.02em;">{{ t.v }}</div>
              <div style="font-size: 12px; font-weight: 500; color: {{ t.fg }};">₪</div>
            </div>
          </div>
        </sc-for>
      </div>

      <!-- ═══ לפי קטגוריה ═══ -->
      <div style="flex-shrink: 0; box-sizing: border-box; border-radius: 20px; padding: 15px 18px; background: linear-gradient(150deg, rgba(255,255,255,0.74) 0%, rgba(255,255,255,0.48) 100%); border: 1px solid rgba(255,255,255,0.8); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 12px 26px -24px rgba(96,80,132,0.5); display: flex; flex-direction: column; gap: 11px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <div style="font-size: 13.5px; font-weight: 600;">{{ catTitle }}</div>
          <div style="font-size: 11px; font-weight: 400; color: #A79FB2;">{{ catTag }}</div>
        </div>
        <sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; gap: 5px;">
            <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;">
              <div style="font-size: 12.5px; font-weight: 500; color: {{ c.deep }};">{{ c.name }}</div>
              <div style="display: flex; align-items: baseline; gap: 7px;">
                <div style="font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;">{{ c.v }} ₪</div>
                <div style="font-size: 11px; font-weight: 500; color: #A79FB2; font-variant-numeric: tabular-nums; min-width: 26px; text-align: left;">{{ c.pct }}</div>
              </div>
            </div>
            <div style="height: 7px; border-radius: 999px; background: rgba(130,112,162,0.1); overflow: hidden;">
              <div class="bar" style="height: 100%; border-radius: 999px; width: {{ c.w }}; background: {{ c.hue }};"></div>
            </div>
          </div>
        </sc-for>
      </div>

      <!-- ═══ הוצאות ═══ -->
      <div style="flex-shrink: 0; box-sizing: border-box; border-radius: 20px; padding: 15px 18px; background: linear-gradient(150deg, rgba(255,255,255,0.74) 0%, rgba(255,255,255,0.48) 100%); border: 1px solid rgba(255,255,255,0.8); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 12px 26px -24px rgba(96,80,132,0.5); display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <div style="font-size: 13.5px; font-weight: 600;">{{ expTitle }}</div>
          <div style="font-size: 11px; font-weight: 400; color: #A79FB2;">{{ expTag }}</div>
        </div>
        <sc-for list="{{ expenses }}" as="e" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="flex-grow: 1; min-width: 0;">
              <div style="font-size: 13px; font-weight: 500;">{{ e.k }}</div>
              <div style="font-size: 11px; font-weight: 300; color: #8A8194; margin-top: 1px;">{{ e.sub }}</div>
            </div>
            <div style="flex-shrink: 0; font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;">{{ e.v }} ₪</div>
          </div>
        </sc-for>
      </div>

      <div style="flex-shrink: 0; height: 108px;"></div>
    </div>

  </div>

  <div style="position: absolute; bottom: 26px; right: 18px; left: 18px; height: 68px; border-radius: 999px; background: linear-gradient(152deg, rgba(255,255,255,0.66) 0%, rgba(255,255,255,0.44) 100%); backdrop-filter: blur(34px) saturate(200%); -webkit-backdrop-filter: blur(34px) saturate(200%); border: 1px solid rgba(255,255,255,0.75); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.95), 0 18px 34px -18px rgba(96,80,132,0.6); display: flex; align-items: center; justify-content: space-around; padding: 0 10px;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 52px; height: 56px; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#918A9E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <div style="font-size: 11px; color: #918A9E;">בית</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 52px; height: 56px; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#918A9E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
      <div style="font-size: 11px; color: #918A9E;">הזמנות</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 52px; height: 56px; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#918A9E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v13H4z"></path><path d="M4 11h16M9 7V4h6v3"></path></svg>
      <div style="font-size: 11px; color: #918A9E;">מלאי</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 52px; height: 56px; cursor: pointer; border-radius: 999px; background: rgba(155,127,212,0.13);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7B5CBC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-6M21 19H3"></path></svg>
      <div style="font-size: 11px; font-weight: 700; color: #7B5CBC;">כספים</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
/* ⚠ אין פיצול מע״מ · שקד עוסקת פטורה, כל הסכומים כפי שנגבו ושולמו */
const nf = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

/* מגשי הפירות אינם בניהול הכספי הזה · לא בהכנסות ולא בהוצאות */
const CATS = [
  { n: 'שלישי של קוסקוס', hue: '#7B5CBC', deep: '#43307A', share: 0.43 },
  { n: 'שישי של מטעמים',  hue: '#416D9E', deep: '#2B4A6E', share: 0.30 },
  { n: 'מארזי ספיישל',    hue: '#437C59', deep: '#2C5A3E', share: 0.23 },
  { n: 'שף וטאבון',       hue: '#A85A28', deep: '#7A3D18', share: 0.04 }
];

/* ⚠ מספרי הדגמה · נכתבו על ידי Claude. המחזור בלי מגשי הפירות. */
const PERIODS = {
  month: { n: 'החודש',  label: 'אוגוסט 2026',        gross: 40900,  factor: 1 },
  quart: { n: 'רבעון',  label: 'יוני–אוגוסט 2026',   gross: 120000, factor: 2.94 },
  year:  { n: 'השנה',   label: 'ספטמבר 2025 – אוגוסט 2026', gross: 350000, factor: 8.55 }
};

/* ההוצאות · הסכומים כפי שהם מופיעים בקבלות */
const EXPENSES = [
  { k: 'חומרי גלם', sub: 'שוק, מחסן וקצביה', gross: 12980 },
  { k: 'אריזות וכלים', sub: 'מארזים, קופסאות וסכו״ם', gross: 3140 },
  { k: 'דלק ומשלוחים', sub: 'נסיעות וחלוקה', gross: 2360 },
  { k: 'ציוד ותחזוקה', sub: 'מטבח וטאבון', gross: 1580 },
  { k: 'שיווק', sub: 'צילום וקידום באינסטגרם', gross: 1180 }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { period: 'month' };
  }

  renderVals() {
    const p = PERIODS[this.state.period];
    const rev = p.gross;
    const exp = Math.round(EXPENSES.reduce((s, e) => s + e.gross, 0) * p.factor);
    const profit = rev - exp;
    const margin = rev > 0 ? Math.round(profit / rev * 100) : 0;

    return {
      sub: p.label,

      periods: Object.keys(PERIODS).map((k) => {
        const on = this.state.period === k;
        return {
          name: PERIODS[k].n,
          bg: on ? 'rgba(123,92,188,0.1)' : 'rgba(255,255,255,0.7)',
          bd: on ? 'rgba(123,92,188,0.42)' : 'rgba(130,112,162,0.16)',
          fg: on ? '#43307A' : '#4A4254',
          w:  on ? '600' : '400',
          pick: () => this.setState({ period: k })
        };
      }),

      revLabel: 'מחזור',
      rev: nf(rev),
      revSub: 'רווחיות ' + margin + '%',

      tiles: [
        { k: 'הוצאות', v: nf(exp), fg: '#A65E2A' },
        { k: 'רווח', v: nf(profit), fg: '#4E8A64' }
      ],

      catTitle: 'לפי קטגוריה',
      catTag: p.n,
      cats: CATS.map((c) => ({
        name: c.n, hue: c.hue, deep: c.deep,
        v: nf(rev * c.share),
        pct: Math.round(c.share * 100) + '%',
        w: Math.round(c.share / CATS[0].share * 100) + '%'
      })),

      expTitle: 'הוצאות',
      expTag: p.n,
      expenses: EXPENSES.map((e) => ({ k: e.k, sub: e.sub, v: nf(Math.round(e.gross * p.factor)) }))
    };
  }
}
</script>
</body>
</html>

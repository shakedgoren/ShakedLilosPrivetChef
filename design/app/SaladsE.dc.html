<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; }
    .press { transition: transform 130ms cubic-bezier(.3,.7,.4,1); }
    .press:active { transform: scale(0.955); }
    @keyframes sheetin { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .sheetin { animation: sheetin 260ms cubic-bezier(.22,.9,.28,1) both; }
  </style>
</helmet>

<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F5; color: #2A2430; font-family: 'Assistant', system-ui, sans-serif; overflow: hidden;">

  <div style="position: absolute; inset: 0; background-image: radial-gradient(56% 36% at 10% 4%, rgba(186,166,228,0.2) 0%, rgba(186,166,228,0) 62%), radial-gradient(58% 38% at 84% 72%, rgba(176,216,190,0.15) 0%, rgba(176,216,190,0) 62%), radial-gradient(76% 44% at 52% 20%, rgba(67,124,89,0.14) 0%, rgba(67,124,89,0) 72%);"></div>

  <div style="position: absolute; top: 30px; right: 18px; width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #FFFFFF 0%, #F9F6FD 45%, #EDE6F7 100%); box-shadow: inset -3px -4px 8px rgba(150,125,190,0.2), inset 2px 3px 6px rgba(255,255,255,0.95); display: flex; align-items: center; justify-content: center;">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6E6478" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
  </div>

  <div style="position: absolute; top: 32px; right: 74px; left: 74px; text-align: center;">
    <div style="font-weight: 600; font-size: 20px; letter-spacing: -0.015em;">קחו כמה שבא לכם 😍</div>
  </div>

  <div style="position: absolute; top: 72px; right: 0; left: 0; display: flex; justify-content: center;">
    <div style="border-radius: 999px; padding: 4px 12px; background: rgba(67,124,89,0.12); border: 1px solid rgba(67,124,89,0.28);">
      <div style="font-size: 11px; font-weight: 600; color: #2C5A3E; letter-spacing: 0.04em;">ה׳ · בונים סלט־סלט</div>
    </div>
  </div>

  <div style="position: absolute; top: 106px; bottom: 104px; right: 18px; left: 18px; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column;">

    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 3px; text-align: center; padding: 0 2px;">
      <div style="font-weight: 600; font-size: 15.5px;">הסלטים שלנו</div>
      <div style="font-size: 12.5px; font-weight: 300; line-height: 1.6; color: #7D7488;">בוחרים את הסלטים שאוהבים ואת הכמות שרוצים.</div>
      <div style="margin-top: -5px; font-size: 12.5px; font-weight: 300; line-height: 1.6; color: #7D7488;">מינימום להזמנה: 500 מ"ל מכל סוג סלט.</div>
      <div style="font-size: 12.5px; font-weight: 600; color: #437C59;">89 ₪ לק"ג — לכל סוגי הסלטים.</div>
    </div>

    <div style="flex-shrink: 0; height: 12px;"></div>

    <sc-if value="{{ hasPicked }}" hint-placeholder-val="{{ true }}"><div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{ picked }}" as="o" hint-placeholder-count="3">
        <div style="box-sizing: border-box; border-radius: 18px; padding: 11px 13px; display: flex; align-items: center; gap: 10px; background: rgba(67,124,89,0.1); border: 1.5px solid rgba(67,124,89,0.42);">
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 13.5px; font-weight: 600; color: #2C5A3E;">{{ o.name }}</div>
            <div style="font-size: 11px; font-weight: 300; color: #7D7488;">{{ o.sum }}</div>
          </div>
          <div style="flex-shrink: 0; display: flex; flex-direction: row-reverse; align-items: center; gap: 6px;">
            <div onClick="{{ o.dec }}" class="press" style="width: 28px; height: 28px; border-radius: 50%; cursor: pointer; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6E6478" stroke-width="2.8" stroke-linecap="round"><path d="M5 12h14"></path></svg></div>
            <div style="min-width: 48px; text-align: center; font-size: 13px; font-weight: 700; color: #2C5A3E; font-variant-numeric: tabular-nums;">{{ o.qty }}</div>
            <div onClick="{{ o.inc }}" class="press" style="width: 28px; height: 28px; border-radius: 50%; cursor: pointer; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#2C5A3E" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></div>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="flex-shrink: 0; height: 10px;"></div></sc-if>

    <div onClick="{{ open }}" class="press" style="flex-shrink: 0; box-sizing: border-box; height: 56px; border-radius: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,255,255,0.66); border: 1.5px dashed rgba(67,124,89,0.45);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2C5A3E" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      <div style="font-size: 14.5px; font-weight: 600; color: #2C5A3E;">{{ addLabel }}</div>
    </div>

    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ true }}"><div style="flex-shrink: 0; margin-top: 10px; font-size: 11.5px; font-weight: 300; color: #A79FB2; text-align: center;">עוד לא בחרתם סלטים</div></sc-if>

    <div style="flex-shrink: 0; height: 14px;"></div>
  </div>

  <div style="position: absolute; bottom: 26px; right: 18px; left: 18px; height: 68px; border-radius: 999px; background: linear-gradient(152deg, rgba(255,255,255,0.66) 0%, rgba(255,255,255,0.44) 100%); backdrop-filter: blur(34px) saturate(200%); -webkit-backdrop-filter: blur(34px) saturate(200%); border: 1px solid rgba(255,255,255,0.75); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.95), 0 18px 34px -18px rgba(96,80,132,0.6); display: flex; align-items: center; justify-content: space-around; padding: 0 10px;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 62px; height: 56px; border-radius: 999px; background: rgba(155,127,212,0.13);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7B5CBC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <div style="font-size: 11px; font-weight: 700; color: #7B5CBC;">בית</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 62px; height: 56px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#918A9E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
      <div style="font-size: 11px; color: #918A9E;">הזמנות</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 62px; height: 56px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#918A9E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"></path></svg>
      <div style="font-size: 11px; color: #918A9E;">אזור אישי</div>
    </div>
  </div>

  <sc-if value="{{ popOpen }}" hint-placeholder-val="{{ true }}"><div onClick="{{ close }}" style="position: absolute; inset: 0; z-index: 30; background: rgba(42,36,48,0.34); backdrop-filter: blur(7px) saturate(120%); -webkit-backdrop-filter: blur(7px) saturate(120%);"></div>
  <div class="sheetin" style="position: absolute; z-index: 31; top: 56px; bottom: 106px; right: 16px; left: 16px; border-radius: 28px; padding: 18px; background: #FEFCFB; box-shadow: 0 26px 60px -22px rgba(60,48,84,0.72); display: flex; flex-direction: column;">
    <div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px;">
      <div style="flex-grow: 1; min-width: 0; text-align: center; padding-right: 32px; font-weight: 600; font-size: 17px;">בחרו סלט</div>
      <div onClick="{{ close }}" style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; background: rgba(130,112,162,0.09); display: flex; align-items: center; justify-content: center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6E6478" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></div>
    </div>
    <div style="flex-grow: 1; overflow-y: auto; scrollbar-width: none; margin-top: 12px; display: flex; flex-direction: column; gap: 7px;">
      <sc-for list="{{ all }}" as="o" hint-placeholder-count="14">
        <div onClick="{{ o.add }}" class="press" style="box-sizing: border-box; border-radius: 16px; padding: 10px 12px; cursor: pointer; display: flex; align-items: center; gap: 9px; background: {{ o.bg }}; border: 1.5px solid {{ o.bd }};">
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 13.5px; font-weight: {{ o.w }}; color: {{ o.fg }};">{{ o.name }}</div>
            <div style="font-size: 11px; font-weight: 300; line-height: 1.45; color: #7D7488;">{{ o.desc }}</div>
          </div>
          <sc-if value="{{ o.on }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#437C59" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
        </div>
      </sc-for>
    </div>
  </div></sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const SALADS = [
  { n: 'מטבוחה של בית', d: 'עגבניות, פלפל אדום, שום, שמן ותבלינים, מבושלים יחד לאט עד לקבלת מטבוחה עשירה, עמוקה ומלאת טעם.' },
  { n: 'סלט ביצים קלאסי', d: 'ביצים קשות, מיונז, בצל ירוק, מלח ופלפל. שילוב קרמי, עדין ומפנק.' },
  { n: 'חציל במיונז', d: 'חציל קלוי, מיונז, שום, מלח ופלפל. סלט קרמי, עשיר ומפנק.' },
  { n: 'חציל מרוקאי', d: 'חציל קלוי, פלפלים, שום, שמן ותבלינים מרוקאיים. סלט מלא אופי, עשיר ומתובל.' },
  { n: 'סלט גזר מרוקאי', d: 'רצועות גזר טרי, שום, שמן, לימון, פפריקה, כמון ותבלינים. מתובל, רענן ובעל נגיעה פיקנטית.' },
  { n: 'סלט מאשוויה', d: 'פלפלים, עגבניות, שום, שמן ותבלינים, קלויים על האש לקבלת טעם מעושן, עמוק ועשיר.' },
  { n: 'סלט כרוב סגול במיונז', d: 'כרוב סגול, מיונז, חומץ, מעט סוכר, מלח ופלפל. פריך, קרמי ומאוזן בטעמים.' },
  { n: 'סלט כרוב לבן חמוץ', d: 'כרוב לבן, חומץ, שמן, לימון, מלח וסוכר. פריך, חמוץ-מתקתק ומרענן.' },
  { n: 'כרוב לבן סיני', d: 'כרוב לבן, בצל ירוק, שמן, סויה, טריקאי וסילאן ומעל נודלס ושקדים מוקפצים. פריך, רענן וקליל.' },
  { n: 'סלק', d: 'סלק מבושל, שמן, לימון, שום, מלח ופלפל חריף. מתקתק, חמצמץ ורענן.' },
  { n: 'טאבולה', d: 'פטרוזיליה, עגבניות, בורגול, עדשים שחורות, בצל, נענע, לימון, שמן זית מלח ופלפל. רענן, עשיר וקליל.' },
  { n: 'עשבים', d: 'פטרוזיליה, כוסברה ונענע, חמוציות, פקאן מסוכר ושקדים פרוסים קלויים, בתיבול מתקתק-חמצמץ. רענן, פריך, ומלא טעם.' },
  { n: 'פלפלים מתוקים', d: 'פלפלים אדומים ומתוקים, שום, שמן, ותבלינים. רכים, עסיסיים ומלאים בטעם.' },
  { n: 'פלפלים חריפים', d: 'פלפלים חריפים קלויים, עם תיבול עשיר ועוקץ. פיקנטיים, חמצמצים ומלאי אופי.' }
];

const STEP  = 100;
const FIRST = 500;
const PER_KG = 89;
const HUE_DEEP = '#2C5A3E';
const SEL_BG = 'rgba(67,124,89,0.1)';
const SEL_BD = 'rgba(67,124,89,0.42)';
const IDLE_BG = 'rgba(255,255,255,0.7)';
const IDLE_BD = 'rgba(130,112,162,0.16)';
const chip = (on) => ({ bg: on ? SEL_BG : IDLE_BG, bd: on ? SEL_BD : IDLE_BD, fg: on ? HUE_DEEP : '#4A4254', w: on ? '600' : '400' });
const sumMl = (m) => Object.keys(m).reduce((s, k) => s + m[k], 0);

class Base extends DCLogic {
  bump(name, dir) {
    const cur = Object.assign({}, this.state.qty);
    const now = cur[name] || 0;
    if (dir > 0) cur[name] = now === 0 ? FIRST : now + STEP;
    else {
      if (now === 0) return;
      const next = now - STEP;
      if (next < FIRST) delete cur[name]; else cur[name] = next;
    }
    this.setState({ qty: cur });
  }
  total() { return Math.round(sumMl(this.state.qty) * PER_KG / 1000); }
}

class Component extends Base {
  constructor(props) { super(props); this.state = { qty: {}, pop: false }; }
  renderVals() {
    const st = this.state;
    const names = Object.keys(st.qty);
    return {
      hasPicked: names.length > 0,
      isEmpty: names.length === 0,
      addLabel: names.length === 0 ? 'הוסיפו סלט' : 'הוסיפו עוד סלט',
      picked: names.map((n) => ({
        name: n, qty: st.qty[n] + ' מ״ל',
        sum: Math.round(st.qty[n] * PER_KG / 1000) + ' ₪',
        inc: () => this.bump(n, +1), dec: () => this.bump(n, -1)
      })),
      open: () => this.setState({ pop: true }),
      close: () => this.setState({ pop: false }),
      popOpen: st.pop,
      all: SALADS.map((s) => {
        const on = !!st.qty[s.n];
        const c = chip(on);
        return {
          name: s.n, desc: s.d, on: on, bg: c.bg, bd: c.bd, fg: c.fg, w: c.w,
          add: () => { if (!on) this.bump(s.n, +1); this.setState({ pop: false }); }
        };
      })
    };
  }
}
</script>
</body>
</html>

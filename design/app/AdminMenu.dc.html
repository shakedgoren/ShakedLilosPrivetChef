<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7B5CBC; } a:hover { color: #6B4FA8; }
    .press { transition: transform 150ms ease; }
    .press:active { transform: scale(0.97); }
    .knob { transition: transform 280ms cubic-bezier(.22,.9,.28,1); }
    input { font-family: 'Assistant', system-ui, sans-serif; }
    input::placeholder { color: #C4BDCE; }
  </style>
</helmet>

<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FCFBFB; color: #2A2430; font-family: 'Assistant', system-ui, sans-serif; overflow: hidden;">

  <div style="position: absolute; inset: 0; background-image: radial-gradient(56% 36% at 10% 4%, rgba(186,166,228,0.08) 0%, rgba(186,166,228,0) 62%), radial-gradient(50% 32% at 92% 12%, rgba(246,180,172,0.05) 0%, rgba(246,180,172,0) 66%);"></div>

  <div style="position: relative; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 30px 18px 0;">

    <div style="flex-shrink: 0;">
      <div style="font-weight: 600; font-size: 21px; letter-spacing: -0.01em;">תפריט</div>
      <div style="font-weight: 300; font-size: 12.5px; color: #8A8194; margin-top: 2px;">{{ sub }}</div>
    </div>

    <div style="flex-shrink: 0; margin: 0 -18px; padding: 0 18px; overflow: hidden;">
      <div style="display: flex; gap: 6px;">
        <sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
          <div onClick="{{ c.pick }}" class="press" style="flex-shrink: 0; box-sizing: border-box; height: 36px; border-radius: 12px; padding: 0 13px; cursor: pointer; background: {{ c.bg }}; border: 1.5px solid {{ c.bd }}; display: flex; align-items: center;">
            <div style="font-size: 12.5px; font-weight: {{ c.w }}; color: {{ c.fg }}; white-space: nowrap;">{{ c.name }}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- ═══ סיכום הקטגוריה ═══ -->
    <div style="flex-shrink: 0; box-sizing: border-box; border-radius: 20px; padding: 13px 16px; background: {{ sumBg }}; border: 1px solid rgba(255,255,255,0.75); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9); display: flex; align-items: center;">
      <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="3">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px;">
          <div style="font-size: 17px; font-weight: 700; color: {{ k.fg }}; font-variant-numeric: tabular-nums;">{{ k.v }}</div>
          <div style="font-size: 10.5px; font-weight: 400; color: #7D7488;">{{ k.k }}</div>
        </div>
      </sc-for>
    </div>

    <div style="flex-grow: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 9px;">

      <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
        <div style="flex-shrink: 0; box-sizing: border-box; border-radius: 18px; padding: 13px 15px; background: linear-gradient(150deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.46) 100%); border-right: 3px solid {{ it.edge }}; border-top: 1.5px solid rgba(255,255,255,0.8); border-bottom: 1.5px solid rgba(255,255,255,0.8); border-left: 1.5px solid rgba(255,255,255,0.8); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 12px 26px -24px rgba(96,80,132,0.5); opacity: {{ it.dim }}; display: flex; flex-direction: column; gap: 11px;">

          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="flex-grow: 1; min-width: 0;">
              <div style="font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em;">{{ it.name }}</div>
              <div style="font-size: 11.5px; font-weight: 300; color: {{ it.marginFg }}; margin-top: 2px;">{{ it.marginLabel }}</div>
            </div>
            <div onClick="{{ it.toggle }}" class="press" style="flex-shrink: 0; position: relative; width: 46px; height: 27px; border-radius: 999px; cursor: pointer; background: {{ it.onBg }};">
              <div class="knob" style="position: absolute; top: 3px; right: 3px; width: 21px; height: 21px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 5px -2px rgba(60,48,84,0.6); transform: {{ it.knob }};"></div>
            </div>
          </div>

          <div style="display: flex; align-items: flex-end; gap: 8px;">
            <div style="flex: 1; min-width: 0;">
              <div style="font-size: 10.5px; font-weight: 500; color: #8A8194; margin-bottom: 3px;">{{ priceLabel }}</div>
              <input type="text" value="{{ it.price }}" onInput="{{ it.setPrice }}" style="width: 100%; box-sizing: border-box; height: 40px; border-radius: 13px; padding: 0 11px; text-align: center; font-size: 14.5px; font-weight: 600; color: #2A2430; background: #FFFFFF; border: 1.5px solid rgba(130,112,162,0.18); outline: none;">
            </div>
            <div style="flex: 1; min-width: 0;">
              <div style="font-size: 10.5px; font-weight: 500; color: #8A8194; margin-bottom: 3px;">{{ costLabel }}</div>
              <input type="text" value="{{ it.cost }}" onInput="{{ it.setCost }}" placeholder="0" style="width: 100%; box-sizing: border-box; height: 40px; border-radius: 13px; padding: 0 11px; text-align: center; font-size: 14.5px; font-weight: 600; color: #A65E2A; background: #FFFFFF; border: 1.5px solid rgba(199,125,62,0.24); outline: none;">
            </div>
            <div style="flex: 1; min-width: 0;">
              <div style="font-size: 10.5px; font-weight: 500; color: #8A8194; margin-bottom: 3px;">{{ profitLabel }}</div>
              <div style="box-sizing: border-box; height: 40px; border-radius: 13px; background: {{ it.profBg }}; display: flex; align-items: center; justify-content: center;">
                <div style="font-size: 14.5px; font-weight: 700; color: {{ it.profFg }}; font-variant-numeric: tabular-nums;">{{ it.profit }}</div>
              </div>
            </div>
          </div>
        </div>
      </sc-for>

      <div style="flex-shrink: 0; font-size: 11.5px; font-weight: 300; line-height: 1.6; color: #A79FB2; text-align: center; padding: 4px 10px 0;">{{ note }}</div>

      <div style="flex-shrink: 0; height: 108px;"></div>
    </div>

  </div>

  <div style="position: absolute; bottom: 26px; right: 18px; left: 18px; height: 68px; border-radius: 999px; background: linear-gradient(152deg, rgba(255,255,255,0.66) 0%, rgba(255,255,255,0.44) 100%); backdrop-filter: blur(34px) saturate(200%); -webkit-backdrop-filter: blur(34px) saturate(200%); border: 1px solid rgba(255,255,255,0.75); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.95), 0 18px 34px -18px rgba(96,80,132,0.6); display: flex; align-items: center; justify-content: space-around; padding: 0 10px;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 52px; height: 56px; cursor: pointer; border-radius: 999px; background: rgba(155,127,212,0.13);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7B5CBC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <div style="font-size: 11px; font-weight: 700; color: #7B5CBC;">בית</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 52px; height: 56px; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#918A9E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
      <div style="font-size: 11px; color: #918A9E;">הזמנות</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 52px; height: 56px; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#918A9E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v13H4z"></path><path d="M4 11h16M9 7V4h6v3"></path></svg>
      <div style="font-size: 11px; color: #918A9E;">מלאי</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 52px; height: 56px; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#918A9E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-6M21 19H3"></path></svg>
      <div style="font-size: 11px; color: #918A9E;">כספים</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const CATS = [
  { id: 'cous',  n: 'קוסקוס',  hue: '#7B5CBC', deep: '#43307A', rgb: '123,92,188' },
  { id: 'schn',  n: 'שישניצל', hue: '#416D9E', deep: '#2B4A6E', rgb: '65,109,158'  },
  { id: 'box',   n: 'ספיישל',  hue: '#437C59', deep: '#2C5A3E', rgb: '67,124,89'   },
  { id: 'fruit', n: 'פירות',   hue: '#B04A76', deep: '#7A2E4E', rgb: '176,74,118'  },
  { id: 'chef',  n: 'שף',      hue: '#A85A28', deep: '#7A3D18', rgb: '168,90,40'   }
];

/* המחירים נלקחו מהמסכים הקיימים.
   ⚠ העלויות (cost) הן הערכות שנכתבו על ידי Claude · שקד מזינה אותן ידנית. */
const MENU = [
  { c: 'cous',  name: 'קוסקוס צמחוני',   price: 45,  cost: 14, on: true },
  { c: 'cous',  name: 'קוסקוס עם עוף',    price: 55,  cost: 22, on: true },
  { c: 'cous',  name: 'קוסקוס עם מפרום',  price: 65,  cost: 31, on: true },
  { c: 'cous',  name: 'תוספת ירקות',      price: 10,  cost: 3,  on: true },
  { c: 'cous',  name: 'תוספת עוף',        price: 15,  cost: 7,  on: true },
  { c: 'cous',  name: 'תוספת מפרום',      price: 20,  cost: 11, on: true },
  { c: 'schn',  name: 'שניצל דק · חלה',   price: 50,  cost: 19, on: true },
  { c: 'schn',  name: 'פילה טמפורה · חלה', price: 60, cost: 27, on: true },
  { c: 'schn',  name: 'מארז 5 חלות',      price: 200, cost: 82, on: true },
  { c: 'schn',  name: 'קוקוט רוטב',       price: 3,   cost: 1,  on: true },
  { c: 'fruit', name: 'מגש קטן',          price: 300, cost: 128, on: true },
  { c: 'fruit', name: 'מגש בינוני',       price: 300, cost: 132, on: true },
  { c: 'fruit', name: 'מגש גדול',         price: 400, cost: 178, on: true },
  { c: 'fruit', name: 'מגש ענק',          price: 450, cost: 205, on: false },
  { c: 'box',   name: 'חלה לכל אירוע',    price: 14,  cost: 5,  on: true },
  { c: 'box',   name: 'סלטים · ק״ג',      price: 89,  cost: 34, on: true },
  { c: 'chef',  name: 'ארוחת שף · לסועד', price: 250, cost: 96, on: true },
  { c: 'chef',  name: 'עמדת טאבון · לסועד', price: 220, cost: 84, on: true }
];

const num = (v) => { const n = parseFloat(String(v).replace(/[^\d.]/g, '')); return isNaN(n) ? 0 : n; };
const a = (rgb, al) => 'rgba(' + rgb + ',' + al + ')';

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      cat: 'cous',
      items: MENU.map((x, i) => Object.assign({}, x, { id: i, price: String(x.price), cost: String(x.cost) }))
    };
  }

  patch(id, p) {
    this.setState({ items: this.state.items.map((x) => x.id === id ? Object.assign({}, x, p) : x) });
  }

  renderVals() {
    const st = this.state;
    const cat = CATS.filter((c) => c.id === st.cat)[0];
    const list = st.items.filter((x) => x.c === st.cat);

    const items = list.map((x) => {
      const price = num(x.price), cost = num(x.cost);
      const profit = price - cost;
      const pct = price > 0 ? Math.round(profit / price * 100) : 0;
      const thin = pct < 40;
      return {
        name: x.name, price: x.price, cost: x.cost,
        profit: profit + ' ₪',
        marginLabel: price > 0 ? 'רווחיות ' + pct + '%' : 'אין מחיר',
        marginFg: thin ? '#A65E2A' : '#4E8A64',
        profBg: thin ? 'rgba(199,125,62,0.12)' : 'rgba(78,138,100,0.12)',
        profFg: thin ? '#A65E2A' : '#4E8A64',
        edge: cat.hue,
        dim: x.on ? '1' : '0.5',
        onBg: x.on ? '#4E8A64' : 'rgba(130,112,162,0.22)',
        knob: x.on ? 'translateX(0)' : 'translateX(-19px)',
        toggle: () => this.patch(x.id, { on: !x.on }),
        setPrice: (e) => this.patch(x.id, { price: e.target.value }),
        setCost:  (e) => this.patch(x.id, { cost: e.target.value })
      };
    });

    const onList = list.filter((x) => x.on);
    const totPrice = onList.reduce((s, x) => s + num(x.price), 0);
    const totCost  = onList.reduce((s, x) => s + num(x.cost), 0);
    const avg = totPrice > 0 ? Math.round((totPrice - totCost) / totPrice * 100) : 0;

    return {
      sub: 'מחירים, עלויות ורווחיות',
      sumBg: a(cat.rgb, 0.1),

      cats: CATS.map((c) => {
        const on = st.cat === c.id;
        return {
          name: c.n,
          bg: on ? a(c.rgb, 0.13) : 'rgba(255,255,255,0.7)',
          bd: on ? a(c.rgb, 0.42) : 'rgba(130,112,162,0.16)',
          fg: on ? c.deep : '#4A4254',
          w: on ? '600' : '400',
          pick: () => this.setState({ cat: c.id })
        };
      }),

      kpis: [
        { k: 'פריטים פעילים', v: onList.length + '/' + list.length, fg: cat.deep },
        { k: 'רווחיות ממוצעת', v: avg + '%', fg: avg < 40 ? '#A65E2A' : '#4E8A64' },
        { k: 'עלות ממוצעת', v: onList.length ? Math.round(totCost / onList.length) + ' ₪' : '—', fg: '#A65E2A' }
      ],

      items: items,
      priceLabel: 'מחיר ₪',
      costLabel: 'עלות ₪',
      profitLabel: 'רווח',
      note: 'הסכומים כוללים מע״מ, כמו שהם נגבים ומשולמים. הפירוט לפני מע״מ נמצא במסך הכספים.'
    };
  }
}
</script>
</body>
</html>

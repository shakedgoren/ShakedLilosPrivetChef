<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7B5CBC; } a:hover { color: #6B4FA8; }
    .press { transition: transform 160ms ease; }
    .press:active { transform: scale(0.97); }
    input { font-family: 'Assistant', system-ui, sans-serif; }
    input::placeholder { color: #B3ABBD; }
    .knob { transition: transform 340ms cubic-bezier(.22,.9,.28,1); }
  </style>
</helmet>

<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FCFBFB; color: #2A2430; font-family: 'Assistant', system-ui, sans-serif; overflow: hidden;">

  <div style="position: absolute; inset: 0; background-image: radial-gradient(56% 36% at 10% 4%, rgba(186,166,228,0.07) 0%, rgba(186,166,228,0) 62%), radial-gradient(50% 32% at 92% 12%, rgba(246,180,172,0.05) 0%, rgba(246,180,172,0) 66%), radial-gradient(58% 38% at 84% 72%, rgba(176,216,190,0.05) 0%, rgba(176,216,190,0) 62%);"></div>

  <div style="position: relative; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; padding: 44px 22px 0;">

    <!-- ── הכותרת ── -->
    <div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <div style="position: relative; width: 84px; height: 84px;">
        <div style="position: absolute; inset: -10px; border-radius: 50%; filter: blur(8px); background: radial-gradient(closest-side, rgba(123,92,188,0.28) 0%, rgba(123,92,188,0.09) 52%, rgba(123,92,188,0) 78%);"></div>
        <div style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 30% 22%, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0) 28%), radial-gradient(circle at 34% 28%, #FFFFFF 0%, rgba(123,92,188,0.07) 38%, rgba(123,92,188,0.24) 100%); box-shadow: inset -7px -9px 18px rgba(123,92,188,0.22), inset 5px 6px 14px rgba(255,255,255,0.98), 0 12px 26px -15px rgba(123,92,188,0.55);"></div>
        <div style="position: absolute; inset: 0; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center;">
          <img src="logo.png" alt="" style="width: 62px; height: 62px; object-fit: contain;">
        </div>
      </div>
      <div style="text-align: center;">
        <div style="font-weight: 600; font-size: 23px; letter-spacing: 0.06em;">BITE &amp; TELL</div>
        <div style="font-weight: 300; font-size: 13px; color: #8A8194; margin-top: 2px;">שף פרטית · יבנה והשפלה</div>
      </div>
    </div>

    <!-- ── מתג כניסה / הרשמה ── -->
    <div style="flex-shrink: 0; box-sizing: border-box; position: relative; margin-top: 24px; height: 46px; border-radius: 999px; padding: 4px; background: rgba(130,112,162,0.08); display: flex;">
      <div class="knob" style="position: absolute; top: 4px; right: 4px; width: calc(50% - 4px); height: 38px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 4px 10px -5px rgba(96,80,132,0.5); transform: {{ knob }};"></div>
      <div onClick="{{ goIn }}" class="press" style="position: relative; flex: 1; border-radius: 999px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
        <div style="font-size: 14px; font-weight: {{ inW }}; color: {{ inFg }};">{{ tabIn }}</div>
      </div>
      <div onClick="{{ goUp }}" class="press" style="position: relative; flex: 1; border-radius: 999px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
        <div style="font-size: 14px; font-weight: {{ upW }}; color: {{ upFg }};">{{ tabUp }}</div>
      </div>
    </div>

    <div style="flex-shrink: 0; margin-top: 16px; font-size: 13.5px; font-weight: 300; line-height: 1.6; color: #7D7488; text-align: center; padding: 0 8px;">{{ lede }}</div>

    <div onClick="{{ google }}" class="press" style="flex-shrink: 0; box-sizing: border-box; margin-top: 18px; height: 52px; border-radius: 999px; cursor: pointer; background: #FFFFFF; border: 1.5px solid rgba(130,112,162,0.2); box-shadow: 0 8px 18px -14px rgba(96,80,132,0.6); display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg width="19" height="19" viewBox="0 0 48 48" style="flex-shrink: 0;">
        <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"></path>
        <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"></path>
        <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"></path>
        <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"></path>
      </svg>
      <div style="font-size: 15px; font-weight: 600; color: #2A2430;">{{ googleLabel }}</div>
    </div>

    <div style="flex-shrink: 0; margin-top: 16px; display: flex; align-items: center; gap: 12px;">
      <div style="flex: 1; height: 1px; background: rgba(130,112,162,0.16);"></div>
      <div style="font-size: 12px; font-weight: 500; color: #A79FB2;">{{ orLabel }}</div>
      <div style="flex: 1; height: 1px; background: rgba(130,112,162,0.16);"></div>
    </div>

    <!-- ── השדות ── -->
    <div style="flex-grow: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; margin-top: 14px; display: flex; flex-direction: column; gap: 11px;">

      <sc-for list="{{ fields }}" as="f" hint-placeholder-count="2">
        <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 5px;">
          <div style="font-size: 11.5px; font-weight: 500; color: #8A8194;">{{ f.label }}</div>
          <div style="position: relative;">
            <input type="{{ f.type }}" value="{{ f.value }}" onInput="{{ f.set }}" placeholder="{{ f.ph }}" style="width: 100%; box-sizing: border-box; height: 50px; border-radius: 16px; padding: 0 13px; padding-left: {{ f.padL }}; font-size: 13.5px; font-weight: 400; color: #2A2430; background: #FFFFFF; border: 1.5px solid {{ f.bd }}; outline: none;">
            <sc-if value="{{ f.isPass }}" hint-placeholder-val="{{ true }}"><div onClick="{{ f.peek }}" class="press" style="position: absolute; left: 6px; top: 7px; width: 36px; height: 36px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A8194" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="2.6"></circle><path d="{{ f.slash }}"></path></svg>
            </div></sc-if>
          </div>
          <sc-if value="{{ f.bad }}" hint-placeholder-val="{{ true }}"><div style="font-size: 11.5px; font-weight: 400; color: #B95349;">{{ f.hint }}</div></sc-if>
        </div>
      </sc-for>

      <sc-if value="{{ isIn }}" hint-placeholder-val="{{ true }}"><div onClick="{{ forgot }}" class="press" style="flex-shrink: 0; align-self: flex-start; cursor: pointer; padding: 2px 2px 0;">
        <div style="font-size: 13px; font-weight: 600; color: #7B5CBC;">{{ forgotLabel }}</div>
      </div></sc-if>

      <sc-if value="{{ isUp }}" hint-placeholder-val="{{ true }}"><div onClick="{{ toggleTerms }}" class="press" style="flex-shrink: 0; display: flex; align-items: flex-start; gap: 9px; cursor: pointer; padding: 4px 2px 0;">
        <div style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 7px; margin-top: 1px; background: {{ termsBg }}; border: 1.5px solid {{ termsBd }}; display: flex; align-items: center; justify-content: center;">
          <sc-if value="{{ terms }}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
        </div>
        <div style="font-size: 12.5px; font-weight: 300; line-height: 1.5; color: #7D7488;">{{ termsLabel }}</div>
      </div></sc-if>

      <div style="flex-shrink: 0; height: 20px;"></div>
    </div>

    <!-- ── הכפתור ── -->
    <div style="flex-shrink: 0; padding-bottom: 26px; display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div onClick="{{ submit }}" class="press" style="width: 100%; box-sizing: border-box; height: 54px; border-radius: 999px; cursor: {{ ctaCur }}; opacity: {{ ctaOp }}; background: linear-gradient(160deg, #D2C2F2 0%, #B9A4E4 100%); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.6), 0 14px 28px -18px rgba(96,80,132,0.9); display: flex; align-items: center; justify-content: center;">
        <div style="font-weight: 600; font-size: 16px; color: #43307A;">{{ cta }}</div>
      </div>

      <div onClick="{{ guest }}" class="press" style="cursor: pointer; padding: 2px;">
        <div style="font-size: 13.5px; font-weight: 500; color: #8A8194;">{{ guestLabel }}</div>
      </div>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const PASS_MIN = 8;
const IDLE_BD = 'rgba(130,112,162,0.18)';
const BAD_BD  = 'rgba(185,83,73,0.5)';

const trim = (v) => String(v || '').trim();
/* טלפון ישראלי · 05X ואחריו שבע ספרות, עם או בלי מקף */
const okPhone = (v) => /^0(5\d|[2-4,8-9])-?\d{7}$/.test(trim(v).replace(/\s/g, ''));
const okMail  = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(trim(v));
/* בכניסה מזדהים בטלפון או במייל · שתי הצורות מתקבלות */
const okWho   = (v) => okPhone(v) || okMail(v);

/* קו נטוי על עין פתוחה · ריק כשהסיסמה מוסתרת */
const SLASH = 'M4 20L20 4';

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      mode: 'in',                    /* in = כניסה · up = הרשמה */
      f: { who: '', pass: '', name: '', phone: '', mail: '', pass2: '' },
      peek: {}, terms: false, touched: false
    };
  }

  set(id, v) {
    const f = Object.assign({}, this.state.f);
    f[id] = v;
    this.setState({ f: f, touched: true });
  }
  peek(id) {
    const p = Object.assign({}, this.state.peek);
    p[id] = !p[id];
    this.setState({ peek: p });
  }
  mode(m) { this.setState({ mode: m, touched: false }); }

  errors() {
    const f = this.state.f;
    const t = this.state.touched;
    if (this.state.mode === 'in') {
      return {
        who:  t && trim(f.who) !== '' && !okWho(f.who),
        pass: t && trim(f.pass) !== '' && trim(f.pass).length < PASS_MIN
      };
    }
    return {
      name:  false,
      phone: t && trim(f.phone) !== '' && !okPhone(f.phone),
      mail:  t && trim(f.mail) !== '' && !okMail(f.mail),
      pass:  t && trim(f.pass) !== '' && trim(f.pass).length < PASS_MIN,
      pass2: t && trim(f.pass2) !== '' && f.pass2 !== f.pass
    };
  }

  ready() {
    const f = this.state.f;
    if (this.state.mode === 'in') return okWho(f.who) && trim(f.pass).length >= PASS_MIN;
    return trim(f.name) !== '' && okPhone(f.phone) && okMail(f.mail)
        && trim(f.pass).length >= PASS_MIN && f.pass2 === f.pass && this.state.terms;
  }

  renderVals() {
    const st = this.state;
    const f = st.f;
    const e = this.errors();
    const isIn = st.mode === 'in';

    const field = (id, label, ph, type, bad, hint) => {
      const isPass = type === 'password';
      const shown = isPass && !!st.peek[id];
      return {
        label: label, ph: ph,
        type: isPass ? (shown ? 'text' : 'password') : type,
        value: f[id] || '',
        bad: !!bad, hint: hint || '',
        bd: bad ? BAD_BD : IDLE_BD,
        isPass: isPass,
        padL: isPass ? '46px' : '13px',
        slash: shown ? '' : SLASH,          /* עין חצויה כשהסיסמה מוסתרת */
        peek: () => this.peek(id),
        set: (ev) => this.set(id, ev.target.value)
      };
    };

    const fields = isIn
      ? [
          field('who',  'טלפון או אימייל', '050-0000000', 'text', e.who, 'צריך טלפון או אימייל תקינים'),
          field('pass', 'סיסמה', 'לפחות ' + PASS_MIN + ' תווים', 'password', e.pass, 'הסיסמה קצרה מדי')
        ]
      : [
          field('name',  'שם מלא', 'שם ושם משפחה', 'text', e.name, ''),
          field('phone', 'טלפון', '050-0000000', 'tel', e.phone, 'מספר טלפון לא תקין'),
          field('mail',  'אימייל', 'name@mail.com', 'email', e.mail, 'כתובת אימייל לא תקינה'),
          field('pass',  'סיסמה', 'לפחות ' + PASS_MIN + ' תווים', 'password', e.pass, 'הסיסמה קצרה מדי'),
          field('pass2', 'אימות הסיסמה', 'שוב, בדיוק אותו דבר', 'password', e.pass2, 'שתי הסיסמאות לא זהות')
        ];

    const can = this.ready();

    return {
      tabIn: 'כניסה', tabUp: 'הרשמה',
      isIn: isIn, isUp: !isIn,
      knob: isIn ? 'translateX(0)' : 'translateX(-100%)',
      inFg: isIn ? '#43307A' : '#8A8194', inW: isIn ? '600' : '400',
      upFg: isIn ? '#8A8194' : '#43307A', upW: isIn ? '400' : '600',
      goIn: () => this.mode('in'),
      goUp: () => this.mode('up'),

      lede: isIn
        ? 'טוב לראות אתכם שוב. נכנסים וממשיכים מאיפה שעצרתם.'
        : 'עוד רגע ואתם בפנים. הפרטים נשמרים כדי שההזמנה הבאה תהיה מהירה.',

      fields: fields,

      forgotLabel: 'שכחתי סיסמה',
      forgot: () => {},

      terms: st.terms,
      termsLabel: 'קראתי ואני מאשר.ת את תנאי השימוש ומדיניות הפרטיות',
      termsBg: st.terms ? '#7B5CBC' : '#FFFFFF',
      termsBd: st.terms ? '#7B5CBC' : IDLE_BD,
      toggleTerms: () => this.setState({ terms: !st.terms, touched: true }),

      cta: isIn ? 'כניסה' : 'יצירת חשבון',
      ctaOp:  can ? '1' : '0.45',
      ctaCur: can ? 'pointer' : 'default',
      submit: () => {},

      googleLabel: 'המשך עם Google',
      google: () => {},
      orLabel: 'או',

      guestLabel: 'להסתכל בלי חשבון',
      guest: () => {}
    };
  }
}
</script>
</body>
</html>

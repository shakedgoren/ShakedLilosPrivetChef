<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7B5CBC; } a:hover { color: #6B4FA8; }
    .press { transition: transform 150ms ease; }
    .press:active { transform: scale(0.97); }
    .chev { transition: transform 300ms cubic-bezier(.22,.9,.28,1); }
    input { font-family: 'Assistant', system-ui, sans-serif; }
    input::placeholder { color: #B3ABBD; }
  </style>
</helmet>

<div dir="rtl" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FCFBFB; color: #2A2430; font-family: 'Assistant', system-ui, sans-serif; overflow: hidden;">

  <div style="position: absolute; inset: 0; background-image: radial-gradient(56% 36% at 10% 4%, rgba(186,166,228,0.08) 0%, rgba(186,166,228,0) 62%), radial-gradient(50% 32% at 92% 12%, rgba(246,180,172,0.05) 0%, rgba(246,180,172,0) 66%);"></div>

  <div style="position: relative; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 30px 18px 0;">

    <div style="flex-shrink: 0;">
      <div style="font-weight: 600; font-size: 21px; letter-spacing: -0.01em;">לקוחות</div>
      <div style="font-weight: 300; font-size: 12.5px; color: #8A8194; margin-top: 2px;">{{ sub }}</div>
    </div>

    <div style="flex-shrink: 0; position: relative;">
      <input type="text" value="{{ q }}" onInput="{{ setQ }}" placeholder="{{ searchPh }}" style="width: 100%; box-sizing: border-box; height: 46px; border-radius: 15px; padding: 0 40px 0 13px; font-size: 13.5px; font-weight: 400; color: #2A2430; background: #FFFFFF; border: 1.5px solid rgba(130,112,162,0.18); outline: none;">
      <div style="position: absolute; right: 13px; top: 14px; pointer-events: none;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B3ABBD" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
      </div>
    </div>

    <div style="flex-shrink: 0; display: flex; gap: 6px;">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="3">
        <div onClick="{{ f.pick }}" class="press" style="flex: 1; box-sizing: border-box; height: 36px; border-radius: 12px; cursor: pointer; background: {{ f.bg }}; border: 1.5px solid {{ f.bd }}; display: flex; align-items: center; justify-content: center; gap: 5px;">
          <div style="font-size: 12.5px; font-weight: {{ f.w }}; color: {{ f.fg }}; white-space: nowrap;">{{ f.name }}</div>
          <div style="font-size: 11px; font-weight: 500; color: {{ f.cfg }}; font-variant-numeric: tabular-nums;">{{ f.n }}</div>
        </div>
      </sc-for>
    </div>

    <div style="flex-grow: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 9px;">

      <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ true }}"><div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding-bottom: 130px;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#C9C2D2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"></path></svg>
        <div style="font-size: 14px; font-weight: 500; color: #A79FB2;">{{ emptyLabel }}</div>
      </div></sc-if>

      <sc-for list="{{ rows }}" as="c" hint-placeholder-count="5">
        <div onClick="{{ c.toggle }}" class="press" style="flex-shrink: 0; box-sizing: border-box; border-radius: 20px; padding: 13px 15px; cursor: pointer; background: linear-gradient(150deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.46) 100%); border: 1.5px solid rgba(255,255,255,0.8); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 12px 26px -24px rgba(96,80,132,0.5); display: flex; flex-direction: column; gap: 11px;">

          <div style="display: flex; align-items: center; gap: 11px;">
            <div style="flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%; background: {{ c.avBg }}; display: flex; align-items: center; justify-content: center;">
              <div style="font-size: 15px; font-weight: 700; color: {{ c.avFg }};">{{ c.initial }}</div>
            </div>
            <div style="flex-grow: 1; min-width: 0;">
              <div style="display: flex; align-items: center; gap: 7px;">
                <div style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em;">{{ c.name }}</div>
                <div style="border-radius: 7px; padding: 1px 7px; background: {{ c.tagBg }};">
                  <div style="font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: {{ c.tagFg }}; white-space: nowrap;">{{ c.tag }}</div>
                </div>
              </div>
              <div style="font-size: 11.5px; font-weight: 300; color: #8A8194; margin-top: 2px;">{{ c.line }}</div>
            </div>
            <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px;">
              <div style="text-align: left;">
                <div style="font-size: 14.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;">{{ c.spent }} ₪</div>
                <div style="font-size: 10.5px; font-weight: 300; color: #A79FB2; white-space: nowrap;">{{ c.spentTag }}</div>
              </div>
              <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A79FB2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; transform: {{ c.spin }};"><path d="M6 9l6 6 6-6"></path></svg>
            </div>
          </div>

          <sc-if value="{{ c.open }}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 10px;">
            <div style="height: 1px; background: rgba(130,112,162,0.14);"></div>

            <sc-for list="{{ c.rows }}" as="r" hint-placeholder-count="4">
              <div style="display: flex; align-items: flex-start; gap: 10px;">
                <div style="flex-shrink: 0; width: 82px; font-size: 11.5px; font-weight: 300; color: #7D7488; line-height: 1.55;">{{ r.k }}</div>
                <div style="flex-grow: 1; min-width: 0; font-size: 12.5px; font-weight: 500; color: #2A2430; line-height: 1.55;">{{ r.v }}</div>
              </div>
            </sc-for>

            <div style="display: flex; flex-wrap: wrap; gap: 5px;">
              <sc-for list="{{ c.likes }}" as="l" hint-placeholder-count="3">
                <div style="border-radius: 8px; padding: 3px 9px; background: {{ l.bg }};">
                  <div style="font-size: 11px; font-weight: 600; color: {{ l.fg }}; white-space: nowrap;">{{ l.t }}</div>
                </div>
              </sc-for>
            </div>

            <div style="display: flex; gap: 7px;">
              <div onClick="{{ c.call }}" class="press" style="flex: 1; height: 38px; border-radius: 999px; cursor: pointer; background: rgba(130,112,162,0.08); display: flex; align-items: center; justify-content: center; gap: 6px;">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#4A4254" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a1.5 1.5 0 0 1-1.7 1.5A16.5 16.5 0 0 1 3.5 5.7 1.5 1.5 0 0 1 5 4z"></path></svg>
                <div style="font-size: 12.5px; font-weight: 600; color: #4A4254;">{{ callLabel }}</div>
              </div>
              <div onClick="{{ c.order }}" class="press" style="flex: 1; height: 38px; border-radius: 999px; cursor: pointer; background: rgba(123,92,188,0.13); display: flex; align-items: center; justify-content: center; gap: 6px;">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#43307A" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
                <div style="font-size: 12.5px; font-weight: 600; color: #43307A;">{{ orderLabel }}</div>
              </div>
            </div>
          </div></sc-if>
        </div>
      </sc-for>

      <div style="flex-shrink: 0; height: 108px;"></div>
    </div>

  </div>

  <div style="position: absolute; bottom: 26px; right: 18px; left: 18px; height: 68px; border-radius: 999px; background: linear-gradient(152deg, rgba(255,255,255,0.66) 0%, rgba(255,255,255,0.44) 100%); backdrop-filter: blur(34px) saturate(200%); -webkit-backdrop-filter: blur(34px) saturate(200%); border: 1px solid rgba(255,255,255,0.75); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.95), 0 18px 34px -18px rgba(96,80,132,0.6); display: flex; align-items: center; justify-content: space-around; padding: 0 10px;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 52px; height: 56px; cursor: pointer; border-radius: 999px; background: rgba(155,127,212,0.13);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7B5CBC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <div style="font-size: 11px; font-weight: 700; color: #7B5CBC;">בית</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 52px; height: 56px; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#918A9E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
      <div style="font-size: 11px; color: #918A9E;">הזמנות</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 52px; height: 56px; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#918A9E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v13H4z"></path><path d="M4 11h16M9 7V4h6v3"></path></svg>
      <div style="font-size: 11px; color: #918A9E;">מלאי</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 52px; height: 56px; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#918A9E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-6M21 19H3"></path></svg>
      <div style="font-size: 11px; color: #918A9E;">כספים</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const HUES = {
  cous:  { n: 'קוסקוס',  hue: '#7B5CBC', deep: '#43307A', rgb: '123,92,188' },
  schn:  { n: 'שישניצל', hue: '#416D9E', deep: '#2B4A6E', rgb: '65,109,158'  },
  box:   { n: 'ספיישל',  hue: '#437C59', deep: '#2C5A3E', rgb: '67,124,89'   },
  fruit: { n: 'פירות',   hue: '#B04A76', deep: '#7A2E4E', rgb: '176,74,118'  },
  chef:  { n: 'שף',      hue: '#A85A28', deep: '#7A3D18', rgb: '168,90,40'   }
};

/* ⚠ לקוחות הדגמה · נכתבו על ידי Claude */
const PEOPLE = [
  { name: 'דנה כהן',    phone: '050-1234567', since: 'מרץ 2026', orders: 14, spent: 2180,
    addr: 'הרצל 14, יבנה',   last: 'שלישי, 1.9 · 3 מנות קוסקוס', likes: ['cous', 'schn'], note: 'אלרגית לשומשום' },
  { name: 'מיכל אברהם', phone: '052-7654321', since: 'ינואר 2026', orders: 23, spent: 4310,
    addr: 'ויצמן 8, רחובות', last: 'שלישי, 1.9 · 4 מנות קוסקוס', likes: ['cous', 'fruit', 'box'], note: '' },
  { name: 'יעל לוי',    phone: '054-9988776', since: 'אוגוסט 2026', orders: 2, spent: 220,
    addr: 'בילו 3, גדרה',    last: 'שישי, 4.9 · 2 חלות שישניצל', likes: ['schn'], note: '' },
  { name: 'רונית שגב',  phone: '053-4455667', since: 'מאי 2026',  orders: 9,  spent: 3050,
    addr: 'הבנים 2, נס ציונה', last: 'רביעי, 27.8 · מגש פירות בינוני', likes: ['fruit', 'box'], note: 'מזמינה לאירועים' },
  { name: 'אורית ברק',  phone: '058-3322110', since: 'אוגוסט 2026', orders: 1, spent: 115,
    addr: 'רוטשילד 21, ראשון לציון', last: 'שלישי, 25.8 · 2 מנות קוסקוס', likes: ['cous'], note: '' },
  { name: 'שירה מזרחי', phone: '050-7778899', since: 'פברואר 2026', orders: 31, spent: 6740,
    addr: 'נופר 25, יבנה',   last: 'שלישי, 1.9 · 4 מנות קוסקוס', likes: ['cous', 'schn', 'chef'], note: 'לקוחה קבועה של שלישי' },
  { name: 'טל אבידן',   phone: '050-1112223', since: 'יולי 2026',  orders: 5,  spent: 890,
    addr: 'הפרחים 9, יבנה',  last: 'שלישי, 25.8 · 4 מנות קוסקוס', likes: ['cous'], note: '' }
];

const REGULAR = 5;   /* מכאן ומעלה נחשבת קבועה */
const nf = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const norm = (v) => String(v || '').replace(/[-\s]/g, '').replace(/^\+972/, '0');
const a = (rgb, al) => 'rgba(' + rgb + ',' + al + ')';

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', filter: 'all', open: -1 };
  }

  renderVals() {
    const st = this.state;
    const q = String(st.q || '').trim();

    const isReg = (p) => p.orders >= REGULAR;
    const byFilter = PEOPLE.filter((p) =>
      st.filter === 'all' ? true : st.filter === 'reg' ? isReg(p) : !isReg(p));

    /* חיפוש · שם או טלפון, עם נרמול פורמטים */
    const shown = byFilter.filter((p) => {
      if (q === '') return true;
      return p.name.indexOf(q) !== -1 || norm(p.phone).indexOf(norm(q)) !== -1;
    });

    const rows = shown.map((p) => {
      const i = PEOPLE.indexOf(p);
      const open = st.open === i;
      const reg = isReg(p);
      return {
        name: p.name, initial: p.name.charAt(0),
        avBg: reg ? 'rgba(123,92,188,0.14)' : 'rgba(130,112,162,0.1)',
        avFg: reg ? '#43307A' : '#8A8194',
        tag: reg ? 'קבועה' : 'חדשה',
        tagBg: reg ? 'rgba(78,138,100,0.14)' : 'rgba(123,92,188,0.12)',
        tagFg: reg ? '#4E8A64' : '#43307A',
        line: p.orders + ' הזמנות · לקוחה מאז ' + p.since,
        spent: nf(p.spent), spentTag: 'סה״כ',
        open: open,
        spin: open ? 'rotate(180deg)' : 'rotate(0deg)',
        rows: [
          { k: 'טלפון', v: p.phone },
          { k: 'כתובת', v: p.addr },
          { k: 'הזמנה אחרונה', v: p.last },
          { k: 'ממוצע להזמנה', v: nf(p.spent / p.orders) + ' ₪' }
        ].concat(p.note ? [{ k: 'הערה', v: p.note }] : []),
        likes: p.likes.map((k) => ({
          t: HUES[k].n, bg: a(HUES[k].rgb, 0.12), fg: HUES[k].deep
        })),
        toggle: () => this.setState({ open: open ? -1 : i }),
        call: () => {},
        order: () => {}
      };
    });

    const count = (f) => PEOPLE.filter((p) =>
      f === 'all' ? true : f === 'reg' ? isReg(p) : !isReg(p)).length;

    return {
      sub: PEOPLE.length + ' לקוחות · ' + nf(PEOPLE.reduce((s, p) => s + p.spent, 0)) + ' ₪ מצטבר',
      searchPh: 'חיפוש לפי שם או טלפון',
      q: st.q,
      setQ: (e) => this.setState({ q: e.target.value, open: -1 }),

      filters: [{ id: 'all', n: 'הכל' }, { id: 'reg', n: 'קבועות' }, { id: 'new', n: 'חדשות' }].map((f) => {
        const on = st.filter === f.id;
        return {
          name: f.n, n: count(f.id),
          bg: on ? 'rgba(123,92,188,0.1)' : 'rgba(255,255,255,0.7)',
          bd: on ? 'rgba(123,92,188,0.42)' : 'rgba(130,112,162,0.16)',
          fg: on ? '#43307A' : '#4A4254',
          cfg: on ? '#7B5CBC' : '#A79FB2',
          w: on ? '600' : '400',
          pick: () => this.setState({ filter: f.id, open: -1 })
        };
      }),

      rows: rows,
      isEmpty: rows.length === 0,
      emptyLabel: 'לא נמצאה לקוחה',
      callLabel: 'חיוג',
      orderLabel: 'הזמנה ידנית'
    };
  }
}
</script>
</body>
</html>

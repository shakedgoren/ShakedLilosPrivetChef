# BITE & TELL · גרסת הדפדפן של האפליקציה
#
# ⚠ **הבנייה כאן, לא אצל Netlify** · `expo export` דורש את כל
# תלויות הפיתוח ואת `mobile/.env` (שבו `EXPO_PUBLIC_API_URL`
# נצרב לתוך הבאנדל בזמן הבנייה). לכן מריצים
# `npx expo export --platform web --clear` מקומית ומעלים את
# `dist` כמו שהיא.
#
# ⚠ **`--clear` חובה** · Metro מחזיר באנדל ממטמון גם אחרי
# שינוי ב-`.env`, וכך כתובת השרת המקומית נצרבה לבנייה שיועדה
# לפרודקשן. זה קרה כאן בפועל.
#
# ⚠ **הפניית כל הנתיבים ל-index.html** · זו אפליקציית עמוד יחיד.
# בלי הכלל הזה רענון בכל מסך שאינו הבית מחזיר 404.

[build]
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ⚠ הבאנדל נושא hash בשם הקובץ · אפשר לשמור אותו לנצח.
# ה-HTML עצמו לעולם לא במטמון, אחרת פריסה חדשה לא מגיעה.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

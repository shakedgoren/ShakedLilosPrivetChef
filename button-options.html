<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>סבב כפתור ״המשך״</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@300;400;500;700&family=Karantina:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;cursor:pointer;border:0;background:none}
body{font-family:'Heebo',sans-serif;font-weight:300;background:#0B111C;color:#EEF2F8;
  padding:26px 14px 70px;-webkit-font-smoothing:antialiased}
.num{font-family:'Karantina',cursive;font-weight:400;font-size:1.2em;letter-spacing:.03em}
.cur{font-family:'Heebo',sans-serif}

.head{max-width:1080px;margin:0 auto 24px;text-align:center}
.head h1{font-family:'Suez One',serif;font-weight:400;font-size:clamp(23px,4.2vw,31px);margin-bottom:9px}
.head p{color:#94A2B5;font-size:14.5px;line-height:1.7;max-width:660px;margin:0 auto}

.deck{max-width:1080px;margin:0 auto;display:grid;gap:18px;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:#111927}
.card-tag{padding:12px 16px 11px}
.card-tag b{font-family:'Suez One',serif;font-weight:400;font-size:17px;display:block;margin-bottom:3px}
.card-tag span{font-size:12px;color:#7C8A9C;line-height:1.5}
.pair{display:grid;grid-template-columns:1fr 1fr}

/* ---- הקשר בהיר · זכוכית נוזלית רמה 2 + כתב חום ---- */
.lite{--fg:#3A2A20;--muted:#7A675C;--brass:#D08A5E;--brass-lit:#EBAB7D;--brass-deep:#9A5C33;
  position:relative;isolation:isolate;overflow:hidden;padding:16px 14px 15px;color:var(--fg);
  background:linear-gradient(168deg,#F7F9FC 0%,#EEF2F8 55%,#F7F9FC 100%)}
.lite::before{content:"";position:absolute;inset:0;z-index:-2;
  background:
    radial-gradient(30% 40% at 22% 14%,rgba(235,150,95,.95),transparent 70%),
    radial-gradient(24% 34% at 84% 30%,rgba(120,170,220,.85),transparent 72%),
    radial-gradient(30% 44% at 62% 86%,rgba(208,138,94,.9),transparent 70%);
  filter:blur(8px);opacity:.85}
.lite .bar{background:linear-gradient(158deg,rgba(255,255,255,.74),rgba(255,255,255,.52) 45%,rgba(255,255,255,.66));
  -webkit-backdrop-filter:blur(30px) saturate(200%);backdrop-filter:blur(30px) saturate(200%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,1),0 0 0 1px rgba(58,42,32,.06),0 16px 32px -22px rgba(90,58,36,.5)}

/* ---- הקשר כהה · המקור ---- */
.dk{--fg:#EEF2F8;--muted:#94A2B5;--brass:#D08A5E;--brass-lit:#EBAB7D;--brass-deep:#EBAB7D;
  padding:16px 14px 15px;color:var(--fg);
  background:linear-gradient(168deg,#0B111C 0%,#0F1826 55%,#0B111C 100%)}
.dk .bar{background:linear-gradient(158deg,rgba(255,255,255,.072),rgba(255,255,255,.014) 50%,rgba(255,255,255,.042));
  -webkit-backdrop-filter:blur(13px) saturate(150%);backdrop-filter:blur(13px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 1px rgba(0,0,0,.26)}

.bar{border-radius:16px;padding:11px 13px 12px;display:flex;flex-direction:column;gap:9px;align-items:center}
.total{display:flex;align-items:baseline;gap:7px;font-size:12px;color:var(--muted)}
.total b{font-family:'Suez One',serif;font-weight:400;font-size:17px;color:var(--brass-deep)}
.mode{font-size:10px;letter-spacing:.2em;color:var(--muted);text-align:center;margin-bottom:9px}

/* ==========================================================
   האופציות
   ========================================================== */

/* 1 · גלולה קומפקטית */
.b1{min-height:40px;padding:0 30px;border-radius:999px;font-size:15px;font-weight:500;
  color:#2A1B12;background:linear-gradient(180deg,var(--brass-lit),var(--brass));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 18px -10px rgba(208,138,94,.7)}

/* 2 · מתאר נחושת */
.b2{min-height:40px;padding:0 28px;border-radius:999px;font-size:15px;font-weight:400;
  color:var(--brass-deep);background:transparent;box-shadow:inset 0 0 0 1.3px var(--brass)}

/* 3 · זכוכית עם שפת נחושת */
.b3{position:relative;min-height:40px;padding:0 28px;border-radius:999px;font-size:15px;font-weight:400;
  color:var(--brass-deep);
  background:linear-gradient(158deg,rgba(255,255,255,.30),rgba(255,255,255,.08));
  -webkit-backdrop-filter:blur(12px) saturate(170%);backdrop-filter:blur(12px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.b3::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;
  background:linear-gradient(150deg,rgba(255,255,255,.9),var(--brass) 55%,rgba(255,255,255,.6));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}

/* 4 · גלולה עם חץ */
.b4{min-height:40px;padding:0 14px 0 22px;border-radius:999px;font-size:15px;font-weight:500;
  color:#2A1B12;background:linear-gradient(180deg,var(--brass-lit),var(--brass));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 18px -10px rgba(208,138,94,.7);
  display:inline-flex;align-items:center;gap:9px}
.b4 svg{width:15px;height:15px;stroke:#2A1B12;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* 7 · המשולב — החומר של 3 עם החץ של 4.
   הריפוד אינו סימטרי: 20px בצד המילה, 12px בצד החץ. כך התוספת של
   החץ נבלעת בריפוד שהוקטן, והרוחב הכולל לא גדל. */
.b7{position:relative;min-height:40px;padding:0 20px 0 12px;border-radius:999px;
  font-size:15px;font-weight:400;color:var(--brass-deep);
  display:inline-flex;align-items:center;gap:7px;
  background:linear-gradient(158deg,rgba(255,255,255,.30),rgba(255,255,255,.08));
  -webkit-backdrop-filter:blur(12px) saturate(170%);backdrop-filter:blur(12px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.b7::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;
  background:linear-gradient(150deg,rgba(255,255,255,.9),var(--brass) 55%,rgba(255,255,255,.6));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
.b7 svg{width:14px;height:14px;stroke:var(--brass-deep);fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .3s cubic-bezier(.22,.85,.28,1)}
.b7:hover svg{transform:translateX(-3px)}

/* 5 · טקסט וקו — המינימלי מכולם */
.b5{padding:6px 2px 7px;font-size:16px;font-weight:400;color:var(--brass-deep);
  position:relative;letter-spacing:.02em}
.b5::after{content:"";position:absolute;inset:auto 0 0 0;height:1.2px;
  background:linear-gradient(90deg,transparent,var(--brass),transparent)}

/* 6 · עיגול חץ */
.b6{width:46px;height:46px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--brass-lit),var(--brass));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 20px -10px rgba(208,138,94,.8)}
.b6 svg{width:17px;height:17px;stroke:#2A1B12;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<div class="head">
  <h1>סבב כפתור ״המשך״</h1>
  <p>שש אופציות, כל אחת בשני המצבים — הזכוכית הבהירה שאישרת (רמה 2, עם כתב חום כהה)
     והכהה הקיים. הכפתור משותף לשניהם, אז הוא חייב לעבוד בשניהם.</p>
</div>

<div class="deck" id="deck"></div>

<script>
const ARROW = '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>';
const OPTS = [
  {c:'b1', label:'המשך', name:'גלולה קומפקטית',
   note:'אותה נחושת, רק קטן וממורכז במקום פס מלא רוחב. השינוי הכי קטן מהקיים.'},
  {c:'b2', label:'המשך', name:'מתאר נחושת',
   note:'שקוף עם קו נחושת. הכי קליל — אבל מוותר על המשקל של פעולה ראשית.'},
  {c:'b3', label:'המשך', name:'זכוכית עם שפת נחושת',
   note:'אותו חומר של הלוחות. מתמזג הכי טוב בשפה החדשה.'},
  {c:'b4', label:'המשך'+ARROW, name:'גלולה עם חץ',
   note:'מוסיף כיוון — העין יודעת לאן זה מוביל. חמוד בלי להיות ילדותי.'},
  {c:'b5', label:'המשך', name:'טקסט וקו',
   note:'המינימלי מכולם. יפה מאוד, אבל הכי קל לפספס — ובשאלון ארוך זה סיכון.'},
  {c:'b6', label:ARROW, name:'עיגול חץ',
   note:'בלי מילים בכלל. הכי קטן וחמוד; דורש שהמשתמש יבין מהקשר.'},
  {c:'b7', label:'המשך'+ARROW, name:'המשולב ★ — זכוכית עם חץ',
   note:'החומר של 3 עם החץ של 4. הריפוד בצד החץ הוקטן, כך שהרוחב לא גדל. החץ זז קלות במעבר עכבר.'}
];

document.getElementById('deck').innerHTML = OPTS.map((o,i)=>`
  <div class="card">
    <div class="card-tag"><b>${i+1}. ${o.name}</b><span>${o.note}</span></div>
    <div class="pair">
      <div class="lite">
        <div class="mode">בהיר</div>
        <div class="bar">
          <div class="total">סה״כ <b><span class="num">4,400</span> <span class="cur">₪</span></b></div>
          <button class="${o.c}">${o.label}</button>
        </div>
      </div>
      <div class="dk">
        <div class="mode">כהה</div>
        <div class="bar">
          <div class="total">סה״כ <b><span class="num">4,400</span> <span class="cur">₪</span></b></div>
          <button class="${o.c}">${o.label}</button>
        </div>
      </div>
    </div>
  </div>`).join('');
</script>

</body>
</html>

# BITE & TELL · Express API on Railway
# Config-as-code (legacy, still applied at deploy). Dashboard values do not override this file.
#
# Root Directory in the Railway service must stay the repository root so the
# Dockerfile can copy server/ and mobile/src/data (catalog prices).

[build]
builder = "DOCKERFILE"
dockerfilePath = "server/Dockerfile"
watchPatterns = [
  "server/**",
  "mobile/src/data/**",
  "mobile/src/order/**",
  "railway.toml",
]

[deploy]
# migrate deploy (Prisma Postgres) then tsx src/index.ts
startCommand = "npm run start:prod"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
